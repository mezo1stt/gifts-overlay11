<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 إطار آخر داعم | Last Supporter Frame</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/last-supporter.css">
</head>
<body>

    <!-- Container for placement -->
    <div class="stage-container" id="stageContainer">

        <!-- Fiery Shockwave Ring (Plays during Intro) -->
        <div class="fire-shockwave" id="shockwave"></div>

        <!-- Canvas for realistic floating sparks and fire embers -->
        <canvas id="fireCanvas" class="fire-canvas"></canvas>

        <!-- Main Supporter Frame -->
        <div class="supporter-frame theme-fire intro-burst" id="supporterFrame">
            
            <!-- Flaming Border Aura -->
            <div class="flame-aura"></div>
            
            <!-- Top Royal Badge -->
            <div class="royal-badge" id="royalBadge">
                <span class="badge-icon">👑</span>
                <span class="badge-text" id="badgeText">آخر داعم للبث</span>
                <span class="badge-flame">🔥</span>
            </div>

            <!-- Frame Inner Container -->
            <div class="frame-content">
                <!-- TikAlert Iframe (with our proxy) -->
                <iframe
                    id="supporterIframe"
                    src=""
                    allowtransparency="true"
                    scrolling="no"
                    frameborder="0">
                </iframe>

                <!-- Fallback / Simulated Preview Card (Shown if iframe loading or in demo mode) -->
                <div class="supporter-card-fallback hidden" id="fallbackCard">
                    <div class="supporter-avatar">
                        <img id="supporterAvatar" src="/images/rose.png" alt="الداعم">
                        <span class="supporter-rank">1#</span>
                    </div>
                    <div class="supporter-info">
                        <h3 class="supporter-name" id="supporterName">mezo_1st</h3>
                        <p class="supporter-gift" id="supporterGift">أرسل: <strong>مكوك فضائي 🚀</strong></p>
                    </div>
                    <div class="supporter-coins" id="supporterCoins">
                        <span>💎 29,999</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Fire Glow Reflection -->
            <div class="flame-reflection"></div>
        </div>

    </div>

    <!-- Floating Test Controls Bar (Visible only when ?test=true or on hover) -->
    <div class="test-controls-bar" id="testBar">
        <button onclick="triggerIntro()" class="btn-fire">🔥 تشغيل الأنترو (Intro)</button>
        <button onclick="triggerOutro()" class="btn-fire">💨 تشغيل الأوترو (Outro)</button>
        <button onclick="toggleTheme()" class="btn-fire">🎨 تغيير الثيم</button>
        <button onclick="simulateNewSupporter()" class="btn-fire">⭐ محاكاة داعم جديد</button>
    </div>

    <script src="/last-supporter.js"></script>
</body>
</html>
