<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Fire Text Widget Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Tajawal:wght@900&family=Almarai:wght@800&family=Changa:wght@800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }

        .fire-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            width: 100%;
            height: 100%;
        }

        /* Spark Canvas */
        .spark-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Shockwave Ring for Burst Intro */
        .fire-shockwave {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #ffd700;
            box-shadow: 0 0 50px #ff4500, inset 0 0 50px #ff8c00;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }

        .fire-shockwave.active {
            animation: shockwaveExpand 0.85s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes shockwaveExpand {
            0% { transform: scale(0.2); opacity: 1; border-width: 10px; }
            100% { transform: scale(8); opacity: 0; border-width: 1px; }
        }

        /* Text Wrapper & Text */
        .fire-text-wrapper {
            position: relative;
            display: inline-block;
            z-index: 10;
        }

        .fire-text {
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
            will-change: opacity, transform, filter, text-shadow;
            opacity: 0;
            transform: scale(0.9);
        }

        /* ================= INTRO ANIMATIONS ================= */

        /* 1. Burst / Slam Intro */
        .intro-burst {
            animation: animBurstIntro var(--intro-dur, 1.2s) cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes animBurstIntro {
            0% {
                opacity: 0;
                transform: scale(0.1) rotate(-5deg);
                filter: brightness(4) blur(10px) drop-shadow(0 0 50px #ff4500);
            }
            60% {
                opacity: 1;
                transform: scale(1.18) rotate(1deg);
                filter: brightness(2) blur(0px) drop-shadow(0 0 35px #ffd700);
            }
            80% {
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: brightness(1);
            }
        }

        /* 2. 3D Slide Intro */
        .intro-slide {
            animation: animSlideIntro var(--intro-dur, 1.2s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes animSlideIntro {
            0% {
                opacity: 0;
                transform: translateY(-90px) scale(0.7) skewX(-12deg);
                filter: blur(12px) brightness(2.5);
            }
            70% {
                opacity: 1;
                transform: translateY(10px) scale(1.05) skewX(2deg);
                filter: blur(0px) brightness(1.2);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) skewX(0deg);
                filter: brightness(1);
            }
        }

        /* 3. Volcano Rise Intro */
        .intro-volcano {
            animation: animVolcanoIntro var(--intro-dur, 1.4s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes animVolcanoIntro {
            0% {
                opacity: 0;
                transform: translateY(120px) scale(0.8);
                filter: blur(15px) brightness(3) drop-shadow(0 0 60px #ff4500);
            }
            60% {
                opacity: 1;
                transform: translateY(-12px) scale(1.06);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px) brightness(1);
            }
        }

        /* 4. Flame Burn In */
        .intro-burn {
            animation: animBurnIntro var(--intro-dur, 1.3s) ease forwards;
        }

        @keyframes animBurnIntro {
            0% {
                opacity: 0;
                transform: scale(1.25);
                filter: blur(25px) brightness(4) drop-shadow(0 0 70px #ffd700);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px) brightness(1);
            }
        }

        /* 5. Smooth Fade Intro */
        .intro-fade {
            animation: animFadeIntro var(--intro-dur, 1.2s) ease-out forwards;
        }

        @keyframes animFadeIntro {
            0% {
                opacity: 0;
                transform: scale(0.92);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
        }

        /* ================= HOLD / ACTIVE PULSE ================= */
        .holding {
            opacity: 1;
            transform: scale(1);
            animation: activeFirePulse 2s ease-in-out infinite;
        }

        @keyframes activeFirePulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.035);
                filter: brightness(1.22) drop-shadow(0 0 25px var(--glow-c, #ff3333));
            }
        }

        /* ================= OUTRO ANIMATIONS ================= */

        /* 1. Combust / Ash Burn Outro */
        .outro-burn {
            animation: animBurnOutro var(--outro-dur, 1s) cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes animBurnOutro {
            0% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1.3);
            }
            30% {
                transform: scale(1.12);
                filter: brightness(3.5) drop-shadow(0 0 60px #ff4500);
            }
            100% {
                opacity: 0;
                transform: scale(0.25) rotate(6deg);
                filter: blur(18px) brightness(0.1);
            }
        }

        /* 2. Slide Outro */
        .outro-slide {
            animation: animSlideOutro var(--outro-dur, 0.9s) cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes animSlideOutro {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(110px) scale(0.7) skewX(8deg);
                filter: blur(12px) brightness(0.3);
            }
        }

        /* 3. Melt Outro */
        .outro-melt {
            animation: animMeltOutro var(--outro-dur, 1s) ease forwards;
        }

        @keyframes animMeltOutro {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                transform: scaleY(0.4) scaleX(1.3) translateY(20px);
                filter: brightness(2) drop-shadow(0 0 40px #ff4500);
            }
            100% {
                opacity: 0;
                transform: scaleY(0.1) scaleX(1.6) translateY(50px);
                filter: blur(15px);
            }
        }

        /* 4. Smooth Fade Outro */
        .outro-fade {
            animation: animFadeOutro var(--outro-dur, 1s) ease-in forwards;
        }

        @keyframes animFadeOutro {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.06);
                filter: blur(8px) brightness(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="fire-stage">
        <!-- Shockwave element -->
        <div class="fire-shockwave" id="shockwave"></div>

        <!-- Canvas for fire spark particles -->
        <canvas id="sparkCanvas" class="spark-canvas"></canvas>

        <!-- Fire Text Container -->
        <div class="fire-text-wrapper" id="textWrapper">
            <div class="fire-text" id="fireText">رابط الدعم بالبايو 🔥</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || 'board_XXXX';

        let settings = {
            text: 'رابط الدعم بالبايو 🔥',
            color: '#A00000',
            shine_color: '#FF3333',
            font_size: 58,
            shine_speed: 4,
            font_family: 'Cairo',
            widget_type: 'both',
            direction: 'right-left',
            intro_duration: 2.5,
            hold_duration: 3.0,
            outro_duration: 2.5,
            shadow_strength: 40,
            neon_enabled: 1,
            neon_strength: 85,
            intro_style: 'burst',   // burst, slide, burn, volcano, fade
            outro_style: 'burn',    // burn, slide, melt, fade
            flame_particles: true,
            sound_enabled: true
        };

        const textEl = document.getElementById('fireText');
        const shockwave = document.getElementById('shockwave');

        // ================= Web Audio API Fire Whoosh ================= //
        function playFireWhoosh() {
            if (!settings.sound_enabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const bufferSize = ctx.sampleRate * 0.55;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(320, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1300, ctx.currentTime + 0.18);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.55);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.55);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                noise.start();
                noise.stop(ctx.currentTime + 0.55);
            } catch (e) {}
        }

        // ================= Settings Loader ================= //
        async function loadSettings() {
            try {
                const res = await fetch(`/api/fire-settings/${uid}?t=${Date.now()}`);
                const data = await res.json();
                if (data.success && data.settings) {
                    settings = { ...settings, ...data.settings };
                    applyVisualStyles();
                }
            } catch (e) {}
        }

        function applyVisualStyles() {
            textEl.textContent = settings.text || 'رابط الدعم بالبايو';
            textEl.style.fontFamily = `'${settings.font_family || 'Cairo'}', sans-serif`;
            textEl.style.fontSize = `${settings.font_size || 58}px`;
            textEl.style.color = settings.color || '#A00000';

            const glowIntensity = settings.neon_enabled ? (settings.neon_strength || 80) / 100 : 0.6;
            const blur1 = (settings.font_size * 0.15) * glowIntensity;
            const blur2 = (settings.font_size * 0.35) * glowIntensity;
            const blur3 = (settings.font_size * 0.65) * glowIntensity;

            textEl.style.textShadow = `
                0 0 ${blur1}px ${settings.shine_color || '#FF3333'},
                0 0 ${blur2}px ${settings.color || '#A00000'},
                0 0 ${blur3}px ${settings.color || '#A00000'},
                0 0 ${blur3 * 1.5}px rgba(255, 69, 0, 0.6)
            `;

            textEl.style.setProperty('--glow-c', settings.shine_color || '#FF3333');
            textEl.style.setProperty('--intro-dur', `${settings.intro_duration || 2.5}s`);
            textEl.style.setProperty('--outro-dur', `${settings.outro_duration || 2.5}s`);
        }

        // ================= Animation Cycle (Intro -> Hold -> Outro -> Loop) ================= //
        let isRunning = false;
        function startAnimationCycle() {
            if (isRunning) return;
            isRunning = true;

            function runCycle() {
                const introStyle = settings.intro_style || 'burst';
                const outroStyle = settings.outro_style || 'burn';
                const introMs = (settings.intro_duration || 2.5) * 1000;
                const holdMs = (settings.hold_duration || 3) * 1000;
                const outroMs = (settings.outro_duration || 2.5) * 1000;

                // 1. Trigger Intro
                textEl.className = 'fire-text';
                void textEl.offsetWidth;

                if (introStyle === 'burst') {
                    shockwave.classList.remove('active');
                    void shockwave.offsetWidth;
                    shockwave.classList.add('active');
                    burstSparks(35);
                } else if (introStyle === 'volcano') {
                    burstSparks(25);
                }

                playFireWhoosh();
                textEl.classList.add(`intro-${introStyle}`);

                // 2. Transition to Hold
                setTimeout(() => {
                    textEl.className = 'fire-text holding';
                }, introMs);

                // 3. Trigger Outro
                setTimeout(() => {
                    textEl.className = 'fire-text';
                    void textEl.offsetWidth;
                    textEl.classList.add(`outro-${outroStyle}`);
                    burstSparks(20);
                }, introMs + holdMs);

                // 4. Repeat after pause
                setTimeout(() => {
                    textEl.className = 'fire-text';
                    setTimeout(runCycle, 600);
                }, introMs + holdMs + outroMs);
            }

            runCycle();
        }

        // ================= Realistic Canvas Sparks & Embers ================= //
        const canvas = document.getElementById('sparkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const MAX_PARTICLES = 40;

        class Spark {
            constructor(x, y, isBurst = false) {
                this.reset(x, y, isBurst);
            }
            reset(x, y, isBurst = false) {
                const rect = textEl.getBoundingClientRect();
                this.x = x !== undefined ? x : rect.left + Math.random() * (rect.width || 300);
                this.y = y !== undefined ? y : rect.bottom - Math.random() * 20;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 2;
                    this.life = 0.7 + Math.random() * 0.5;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.6;
                    this.vy = -(1.5 + Math.random() * 2.8);
                    this.life = 1;
                }
                this.maxLife = this.life;
                this.decay = 0.015 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 4;
                const colors = ['#ff4500', '#ff8c00', '#ffd700', '#ff2200', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size = Math.max(0.4, this.size * 0.98);
                if (this.life <= 0) this.reset();
            }
            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < MAX_PARTICLES; i++) particles.push(new Spark());

        function burstSparks(count = 25) {
            const rect = textEl.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < count; i++) particles.push(new Spark(cx, cy, true));
        }

        function renderSparks() {
            ctx.clearRect(0, 0, width, height);
            if (settings.flame_particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                    if (p.life <= 0 && particles.length > MAX_PARTICLES) particles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderSparks);
        }
        renderSparks();

        // Boot
        loadSettings().then(() => {
            applyVisualStyles();
            startAnimationCycle();
        });

        setInterval(loadSettings, 3000);
    </script>
</body>
</html>
