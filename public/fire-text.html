<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 شريط الدعم والنيون | Support Bio Neon Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&family=Almarai:wght@800;900&family=Changa:wght@800;900&family=El+Messiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-c: #ff1e00;
            --shine-c: #ffd700;
            --font-sz: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            user-select: none;
        }

        /* Stage Container */
        .stage-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .stage-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        /* ================= BANNER BOX CONTAINER ================= */
        .fire-banner-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 44px;
            border-radius: 20px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            opacity: 1;
            will-change: transform, opacity, filter;
        }

        /* 1. Transparent Frame (بدون إطار إطلاقاً - نص حر شفاف) */
        .frame-transparent,
        .frame-none {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 10px 24px !important;
        }

        /* 2. Glass Frame (إطار زجاجي راقي) */
        .frame-glass {
            background: rgba(12, 10, 18, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.8),
                0 0 20px var(--fire-c, #ff1e00);
            backdrop-filter: blur(12px);
        }

        /* 3. Magma Frame (إطار نيون أحمر) */
        .frame-magma {
            background: rgba(22, 6, 10, 0.9);
            border: 2.5px solid var(--shine-c, #ffd700);
            border-radius: 18px;
            box-shadow: 
                0 10px 35px rgba(0, 0, 0, 0.85),
                0 0 25px var(--fire-c, #ff1e00);
            backdrop-filter: blur(12px);
        }

        /* 4. Cyber Neon Frame (إطار سايبر نيون متوهج بحواف أنيقة) */
        .frame-cyber_neon {
            background: rgba(8, 12, 22, 0.9);
            border: 2px solid var(--shine-c, #00f0ff);
            border-radius: 16px;
            box-shadow: 
                0 8px 30px rgba(0, 0, 0, 0.9),
                0 0 20px var(--shine-c, #00f0ff);
            backdrop-filter: blur(12px);
        }

        /* 5. Royal Gold Frame (إطار ذهبي ملكي) */
        .frame-gold_royal {
            background: rgba(20, 15, 5, 0.9);
            border: 2px solid #ffd700;
            border-radius: 18px;
            box-shadow: 
                0 10px 35px rgba(0, 0, 0, 0.9),
                0 0 25px rgba(255, 215, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        /* ================= TEXT ELEMENTS ================= */
        .fire-text-wrapper {
            position: relative;
            display: inline-block;
            z-index: 12;
            white-space: nowrap;
        }

        .fire-text-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #000;
            pointer-events: none;
            z-index: 1;
            opacity: 0.65;
            filter: blur(3px);
        }

        .fire-text-front {
            position: relative;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #ffffff;
            z-index: 2;
            will-change: transform, opacity;
            -webkit-text-stroke: 1px rgba(0, 0, 0, 0.85);
            transition: all 0.3s ease;
        }

        /* ================= Glowing Neon Smoke Aura (هالة الدخان النيون) ================= */
        .smoke-neon-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 680px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, var(--fire-c, #ff1e00) 20%, var(--shine-c, #ffd700) 50%, transparent 75%);
            filter: blur(42px);
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.35s ease, transform 0.4s ease;
            mix-blend-mode: screen;
        }

        .smoke-neon-aura.active {
            opacity: 0.9;
            animation: neonSmokePulse 1s ease-in-out infinite alternate;
        }

        @keyframes neonSmokePulse {
            0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.75; }
            100% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.95; }
        }

        /* ================= FootageCrate Appear Neon Smoke Video Layer ================= */
        .sky-smoke-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 860px;
            max-width: 95vw;
            height: 560px;
            object-fit: contain;
            pointer-events: none;
            z-index: 35; /* يمر فوق النص تماماً */
            opacity: 0;
            display: none;
            mix-blend-mode: screen;
            /* فلتر النيون للدخان ليصبح مشعاً ومضيئاً بألوان النيون */
            filter: 
                drop-shadow(0 0 16px var(--fire-c, #ff1e00))
                drop-shadow(0 0 35px var(--shine-c, #ffd700))
                drop-shadow(0 0 65px var(--fire-c, #ff1e00))
                brightness(1.9)
                contrast(1.4)
                saturate(3);
            transition: opacity 0.25s ease;
        }

        .sky-smoke-video.active {
            opacity: 1;
            display: block;
        }

        /* ================= ANIMATION CHOREOGRAPHY ================= */
        
        /* 1. Holding State (النص ثابت وظاهر بوضوح تام بنمط النيون) */
        .banner-holding {
            opacity: 1 !important;
            transform: translateY(0) scale(1) !important;
            filter: blur(0px) !important;
        }

        /* 2. Smoke Wipe Out (الدخان لما ينزل تتلاشى الكلمة معه بسلاسة) */
        .banner-smoke-out {
            opacity: 0 !important;
            transform: translateY(12px) scale(0.95) !important;
            filter: blur(8px) !important;
            transition: opacity 0.35s ease-out, transform 0.35s ease-out, filter 0.35s ease-out !important;
        }

        /* 3. Smooth Slide In (ظهور انسيابي ناعم SLIDE IN) */
        .banner-slide-in {
            animation: animNeonSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
        }

        @keyframes animNeonSlideIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
                filter: blur(5px);
            }
            65% {
                opacity: 1;
                transform: translateY(-3px) scale(1.02);
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
    </style>
</head>
<body>

    <div class="stage-wrapper" id="stageWrapper">
        <div class="stage-inner" id="stageInner">

            <!-- Fire Banner Box -->
            <div class="fire-banner-box frame-transparent banner-holding" id="bannerBox">
                <!-- Text Wrapper -->
                <div class="fire-text-wrapper" id="textWrapper">
                    <div class="fire-text-back" id="textBack">رابط الدعم في البايو 🔥</div>
                    <div class="fire-text-front" id="textFront">رابط الدعم في البايو 🔥</div>
                </div>
            </div>

            <!-- Glowing Neon Smoke Aura (هالة الدخان النيون) -->
            <div class="smoke-neon-aura" id="smokeNeonAura"></div>

            <!-- FootageCrate Smoke Vortex Layer (Descent & Sweep - OVER TEXT) -->
            <video id="skySmokeVideo" class="sky-smoke-video" src="/videos/appear_from_sky.webm" autoplay playsinline muted preload="auto"></video>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || localStorage.getItem('gifts_last_uid') || 'board_XXXX';

        let settings = {
            text: 'رابط الدعم في البايو 🔥',
            color: '#ff1e00',
            shine_color: '#ffd700',
            font_size: 64,
            neon_enabled: true,
            neon_strength: 95,
            banner_style: 'transparent',
            display_mode: 'cycle',
            smoke_enabled: true,
            hold_duration: 6,
            loop_interval: 6,
            position_v: 'center',
            offset_y: 0
        };

        const bannerBox = document.getElementById('bannerBox');
        const textWrapper = document.getElementById('textWrapper');
        const textBack = document.getElementById('textBack');
        const textFront = document.getElementById('textFront');
        const stageWrapper = document.getElementById('stageWrapper');
        const stageInner = document.getElementById('stageInner');
        const skySmokeVideo = document.getElementById('skySmokeVideo');
        const smokeNeonAura = document.getElementById('smokeNeonAura');

        // Apply Styles to DOM
        function applyStyles() {
            // Text Content
            const txt = settings.text || 'رابط الدعم في البايو 🔥';
            textFront.textContent = txt;
            textBack.textContent = txt;

            // Font Size
            const fSize = settings.font_size || 64;
            textFront.style.fontSize = `${fSize}px`;
            textBack.style.fontSize = `${fSize}px`;

            // Colors
            const pri = settings.color || '#ff1e00';
            const sec = settings.shine_color || '#ffd700';
            document.documentElement.style.setProperty('--fire-c', pri);
            document.documentElement.style.setProperty('--shine-c', sec);

            // Positioning
            const posV = settings.position_v || 'center';
            if (posV === 'top') {
                stageWrapper.style.alignItems = 'flex-start';
                stageWrapper.style.paddingTop = '50px';
                stageWrapper.style.paddingBottom = '0';
            } else if (posV === 'bottom') {
                stageWrapper.style.alignItems = 'flex-end';
                stageWrapper.style.paddingTop = '0';
                stageWrapper.style.paddingBottom = '50px';
            } else {
                stageWrapper.style.alignItems = 'center';
                stageWrapper.style.paddingTop = '0';
                stageWrapper.style.paddingBottom = '0';
            }

            const offY = settings.offset_y || 0;
            stageInner.style.transform = `translateY(${offY}px)`;

            // Frame Style
            const frameStyle = settings.banner_style || 'transparent';
            if (!bannerBox.classList.contains('banner-smoke-out') && !bannerBox.classList.contains('banner-slide-in')) {
                bannerBox.className = `fire-banner-box frame-${frameStyle} banner-holding`;
            }

            // Neon Styling (نيون نقي وواضح بدون توهج حارق أو شرار)
            const isNeon = settings.neon_enabled !== false && settings.neon_enabled !== 0;
            if (isNeon) {
                const str = Math.max(0.4, (settings.neon_strength || 85) / 100);
                const g1 = Math.round(4 * str);
                const g2 = Math.round(12 * str);
                const g3 = Math.round(24 * str);
                const g4 = Math.round(42 * str);

                textFront.style.color = '#ffffff';
                textFront.style.textShadow = `
                    0 0 ${g1}px #ffffff,
                    0 0 ${g2}px ${sec},
                    0 0 ${g3}px ${pri},
                    0 0 ${g4}px ${pri}
                `;
                textFront.style.webkitTextFillColor = '#ffffff';
                textFront.style.filter = 'none';
            } else {
                // Non-neon clean text
                textFront.style.color = '#ffffff';
                textFront.style.textShadow = '0 3px 10px rgba(0, 0, 0, 0.9)';
                textFront.style.webkitTextFillColor = '#ffffff';
                textFront.style.filter = 'none';
            }
        }

        // ================= Animation Engine ================= //
        let cycleTimeout = null;
        let isCycleRunning = false;

        function setupAnimationMode() {
            clearTimeout(cycleTimeout);
            isCycleRunning = false;

            const isSmokeOn = settings.smoke_enabled !== false && settings.smoke_enabled !== 0 && settings.smoke_enabled !== 'false';
            const frame = settings.banner_style || 'transparent';

            if (!isSmokeOn) {
                // Smoke disabled: keep text holding in place smoothly
                if (skySmokeVideo) {
                    skySmokeVideo.classList.remove('active');
                    skySmokeVideo.pause();
                }
                if (smokeNeonAura) smokeNeonAura.classList.remove('active');
                bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;
                bannerBox.style.opacity = '1';
                return;
            }

            // Smoke enabled: run the smoke wipe -> vanish -> slide in cycle!
            runSmokeSlideCycle(false);
        }

        function triggerInstantSmokeWipe() {
            const frame = settings.banner_style || 'transparent';
            if (skySmokeVideo) {
                skySmokeVideo.classList.add('active');
                skySmokeVideo.currentTime = 0;
                skySmokeVideo.play().catch(() => {});
            }
            if (smokeNeonAura) smokeNeonAura.classList.add('active');

            // As smoke descends over the text (~380ms), text dissolves with smoke!
            setTimeout(() => {
                bannerBox.className = `fire-banner-box frame-${frame} banner-smoke-out`;

                // Smoke disperses (~1600ms)
                setTimeout(() => {
                    if (skySmokeVideo) skySmokeVideo.classList.remove('active');
                    if (smokeNeonAura) smokeNeonAura.classList.remove('active');

                    // Slide back in!
                    setTimeout(() => {
                        bannerBox.className = `fire-banner-box frame-${frame} banner-slide-in`;
                        setTimeout(() => {
                            bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;
                        }, 800);
                    }, 250);

                }, 1250);

            }, 380);
        }

        function runSmokeSlideCycle(isInitial = false) {
            const isSmokeOn = settings.smoke_enabled !== false && settings.smoke_enabled !== 0 && settings.smoke_enabled !== 'false';
            const frame = settings.banner_style || 'transparent';

            if (!isSmokeOn) {
                bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;
                bannerBox.style.opacity = '1';
                return;
            }

            clearTimeout(cycleTimeout);
            isCycleRunning = true;

            const holdMs = isInitial ? 1500 : Math.max(2.5, (settings.hold_duration || 5)) * 1000;
            const intervalMs = Math.max(2, (settings.loop_interval || 6)) * 1000;

            // Wait for hold duration before starting smoke wipe
            cycleTimeout = setTimeout(() => {
                // 1. Neon Smoke video descends from sky and glowing neon aura lights up
                if (skySmokeVideo) {
                    skySmokeVideo.classList.add('active');
                    skySmokeVideo.currentTime = 0;
                    skySmokeVideo.play().catch(() => {});
                }
                if (smokeNeonAura) {
                    smokeNeonAura.classList.add('active');
                }

                // 2. As the smoke cloud sweeps over the text (~380ms), the word dissolves and fades away WITH the smoke!
                cycleTimeout = setTimeout(() => {
                    bannerBox.className = `fire-banner-box frame-${frame} banner-smoke-out`;

                    // 3. At ~1600ms, the dense smoke finishes and starts dispersing
                    cycleTimeout = setTimeout(() => {
                        if (skySmokeVideo) skySmokeVideo.classList.remove('active');
                        if (smokeNeonAura) smokeNeonAura.classList.remove('active');

                        // 4. Short breath, then text re-enters with smooth SLIDE IN!
                        cycleTimeout = setTimeout(() => {
                            bannerBox.className = `fire-banner-box frame-${frame} banner-slide-in`;

                            // 5. Once slide in finishes (800ms), lock in holding state
                            cycleTimeout = setTimeout(() => {
                                bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;

                                // 6. Schedule next smoke sweep
                                cycleTimeout = setTimeout(() => {
                                    runSmokeSlideCycle(false);
                                }, intervalMs);

                            }, 800);

                        }, 250);

                    }, 1250);

                }, 380);

            }, holdMs);
        }

        // ================= Message Listener (for live preview iframe in dashboard) ================= //
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'fire_settings_update') {
                settings = { ...settings, ...(data.settings || {}) };
                applyStyles();
                setupAnimationMode();
            } else if (data.type === 'test_action') {
                if (data.action === 'smoke_cycle') {
                    clearTimeout(cycleTimeout);
                    triggerInstantSmokeWipe();
                }
            }
        });

        // ================= Socket.io Real-Time Updates ================= //
        try {
            const socket = io();
            socket.on('fire_settings_update', (data) => {
                if (!data || data.uid === uid) {
                    settings = { ...settings, ...(data.settings || data) };
                    applyStyles();
                    setupAnimationMode();
                }
            });
        } catch (e) {}

        // ================= Load Settings via HTTP ================= //
        async function loadSettings() {
            try {
                const res = await fetch(`/api/fire-settings/${encodeURIComponent(uid)}?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.settings) {
                        settings = { ...settings, ...data.settings };
                        applyStyles();
                        setupAnimationMode();
                    }
                }
            } catch (e) {}
        }

        loadSettings().then(() => {
            applyStyles();
            // Start initial smoke wipe quickly after 1.5s
            runSmokeSlideCycle(true);
        });

        // Polling fallback
        setInterval(loadSettings, 4000);
    </script>
</body>
</html>
