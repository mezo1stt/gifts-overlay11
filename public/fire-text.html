<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 شريط النص الناري | Fire Text Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&family=Almarai:wght@800;900&family=Changa:wght@800;900&family=El+Messiri:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-c: #ff1e00;
            --shine-c: #ffd700;
            --font-sz: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            user-select: none;
        }

        /* Stage Container */
        .stage-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .stage-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        /* Spark Embers Canvas */
        .spark-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* ================= BANNER BOX CONTAINER ================= */
        .fire-banner-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 44px;
            border-radius: 20px;
            transition: border 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            z-index: 20; /* IN FRONT OF SMOKE */
            opacity: 1;
        }

        /* 1. Transparent Frame (بدون إطار إطلاقاً - نص حر شفاف) */
        .frame-transparent,
        .frame-none {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 10px 24px !important;
        }

        /* 2. Glass Frame (إطار زجاجي فاخر) */
        .frame-glass {
            background: rgba(10, 10, 18, 0.88);
            border: 2px solid rgba(255, 69, 0, 0.65);
            box-shadow: 
                0 10px 35px rgba(0, 0, 0, 0.85),
                0 0 25px rgba(255, 30, 0, 0.45),
                inset 0 0 20px rgba(255, 69, 0, 0.25);
            backdrop-filter: blur(14px);
        }

        /* 3. Magma Frame (شريط الحمم البركانية) */
        .frame-magma {
            background: linear-gradient(135deg, rgba(35, 10, 10, 0.94), rgba(15, 6, 8, 0.94));
            border: 2.5px solid var(--shine-c, #ffd700);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.9),
                0 0 35px var(--fire-c, #ff1e00),
                inset 0 0 25px rgba(255, 69, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        /* 4. Cyber Neon Frame (إطار سايبر نيون) */
        .frame-cyber_neon {
            background: rgba(10, 15, 25, 0.92);
            border: 2px solid var(--shine-c, #00f0ff);
            border-radius: 14px;
            box-shadow: 
                0 0 25px var(--shine-c, #00f0ff),
                0 0 50px rgba(0, 240, 255, 0.4),
                inset 0 0 18px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(14px);
        }

        /* 5. Royal Gold Frame (إطار ذهبي ملكي) */
        .frame-gold_royal {
            background: linear-gradient(135deg, rgba(28, 20, 5, 0.94), rgba(12, 8, 2, 0.94));
            border: 2px solid #ffd700;
            border-radius: 18px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.9),
                0 0 30px #ffd700,
                inset 0 0 22px rgba(255, 215, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        /* ================= TEXT ELEMENTS ================= */
        .fire-text-wrapper {
            position: relative;
            display: inline-block;
            z-index: 22;
            white-space: nowrap;
        }

        .fire-text-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #1a0000;
            pointer-events: none;
            z-index: 1;
        }

        .fire-text-front {
            position: relative;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #ffffff;
            z-index: 2;
            will-change: transform, filter, opacity;
            -webkit-text-stroke: 1.5px rgba(25, 0, 0, 0.95);
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9);
            transition: filter 0.3s ease;
        }

        /* ================= FootageCrate Appear From Sky Smoke Layer (خلف النص) ================= */
        .sky-smoke-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 760px;
            height: 560px;
            object-fit: contain;
            pointer-events: none;
            z-index: 5; /* خلف النص تماماً */
            display: none;
            filter: drop-shadow(0 0 24px var(--fire-c, #ff1e00)) contrast(115%);
        }

        /* ================= ANIMATION CHOREOGRAPHY ================= */
        
        /* 1. Natural Clean Appearance (الظهور الطبيعي) */
        .banner-natural-in {
            animation: animNaturalIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes animNaturalIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
        }

        /* 2. Holding state */
        .banner-holding {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        /* 3. Soft Fade Outro under the smoke (يجي الدخان يشيلها وتتلاشى بنعومة) */
        .banner-smoke-out {
            animation: animSmokeFadeOut 0.75s ease-in-out forwards;
        }
        @keyframes animSmokeFadeOut {
            0% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.03);
                filter: blur(10px);
            }
        }
    </style>
</head>
<body>

    <div class="stage-wrapper" id="stageWrapper">
        <div class="stage-inner" id="stageInner">

            <!-- FootageCrate Smoke Vortex Layer (Descent & Wipe - BEHIND TEXT) -->
            <video id="skySmokeVideo" class="sky-smoke-video" src="/videos/appear_from_sky.webm" playsinline muted preload="auto"></video>

            <!-- Fire Banner Box (IN FRONT OF SMOKE) -->
            <div class="fire-banner-box frame-transparent" id="bannerBox">
                <!-- Text Wrapper -->
                <div class="fire-text-wrapper" id="textWrapper">
                    <div class="fire-text-back" id="textBack">رابط الدعم في البايو 🔥</div>
                    <div class="fire-text-front" id="textFront">رابط الدعم في البايو 🔥</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Canvas for subtle atmospheric sparks -->
    <canvas id="sparkCanvas" class="spark-canvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || localStorage.getItem('gifts_last_uid') || 'board_XXXX';

        let settings = {
            text: 'رابط الدعم في البايو 🔥',
            color: '#ff1e00',
            shine_color: '#ffd700',
            font_size: 64,
            neon_enabled: true,
            neon_strength: 95,
            banner_style: 'transparent',
            display_mode: 'continuous', // 'continuous' or 'cycle'
            smoke_enabled: true,
            hold_duration: 6,
            loop_interval: 8,
            position_v: 'center',
            offset_y: 0
        };

        const bannerBox = document.getElementById('bannerBox');
        const textWrapper = document.getElementById('textWrapper');
        const textBack = document.getElementById('textBack');
        const textFront = document.getElementById('textFront');
        const stageWrapper = document.getElementById('stageWrapper');
        const stageInner = document.getElementById('stageInner');
        const skySmokeVideo = document.getElementById('skySmokeVideo');
        const sparkCanvas = document.getElementById('sparkCanvas');

        // Apply Styles to DOM
        function applyStyles() {
            // Text Content
            const txt = settings.text || 'رابط الدعم في البايو 🔥';
            textFront.textContent = txt;
            textBack.textContent = txt;

            // Font Size
            const fSize = settings.font_size || 64;
            textFront.style.fontSize = `${fSize}px`;
            textBack.style.fontSize = `${fSize}px`;

            // Colors
            const pri = settings.color || '#ff1e00';
            const sec = settings.shine_color || '#ffd700';
            document.documentElement.style.setProperty('--fire-c', pri);
            document.documentElement.style.setProperty('--shine-c', sec);

            // Positioning
            const posV = settings.position_v || 'center';
            if (posV === 'top') {
                stageWrapper.style.alignItems = 'flex-start';
                stageWrapper.style.paddingTop = '50px';
                stageWrapper.style.paddingBottom = '0';
            } else if (posV === 'bottom') {
                stageWrapper.style.alignItems = 'flex-end';
                stageWrapper.style.paddingTop = '0';
                stageWrapper.style.paddingBottom = '50px';
            } else {
                stageWrapper.style.alignItems = 'center';
                stageWrapper.style.paddingTop = '0';
                stageWrapper.style.paddingBottom = '0';
            }

            const offY = settings.offset_y || 0;
            stageInner.style.transform = `translateY(${offY}px)`;

            // Frame Style
            const frameStyle = settings.banner_style || 'transparent';
            bannerBox.className = `fire-banner-box frame-${frameStyle}`;

            // Neon Glow Styling (خيار خط نيون ولا لا)
            const isNeon = settings.neon_enabled !== false && settings.neon_enabled !== 0;
            if (isNeon) {
                const str = (settings.neon_strength || 95) / 100;
                const g1 = Math.round(8 * str);
                const g2 = Math.round(20 * str);
                const g3 = Math.round(42 * str);
                const g4 = Math.round(68 * str);

                textFront.style.filter = `
                    drop-shadow(0 0 ${g1}px #ffffff)
                    drop-shadow(0 0 ${g2}px ${sec})
                    drop-shadow(0 0 ${g3}px ${pri})
                    drop-shadow(0 0 ${g4}px ${pri})
                `;
                textFront.style.background = `linear-gradient(180deg, #ffffff 0%, #fff8b3 20%, ${sec} 50%, ${pri} 85%, #4a0000 100%)`;
                textFront.style.webkitBackgroundClip = 'text';
                textFront.style.backgroundClip = 'text';
                textFront.style.webkitTextFillColor = 'transparent';
            } else {
                // Non-neon clean text
                textFront.style.filter = 'drop-shadow(0 3px 6px rgba(0, 0, 0, 0.9))';
                textFront.style.background = `linear-gradient(180deg, #ffffff 15%, ${sec} 65%, ${pri} 100%)`;
                textFront.style.webkitBackgroundClip = 'text';
                textFront.style.backgroundClip = 'text';
                textFront.style.webkitTextFillColor = 'transparent';
            }
        }

        // ================= Animation Engine ================= //
        let cycleTimeout = null;
        let isCycleRunning = false;

        function setupAnimationMode() {
            clearTimeout(cycleTimeout);
            isCycleRunning = false;

            const frame = settings.banner_style || 'transparent';
            const isSmokeOn = settings.smoke_enabled !== false && settings.smoke_enabled !== 0 && settings.smoke_enabled !== 'false';

            if (settings.display_mode === 'continuous') {
                // Static display: always visible!
                if (isSmokeOn && skySmokeVideo) {
                    skySmokeVideo.style.display = 'block';
                    skySmokeVideo.loop = true;
                    skySmokeVideo.play().catch(() => {});
                } else if (skySmokeVideo) {
                    skySmokeVideo.style.display = 'none';
                    skySmokeVideo.pause();
                }
                bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;
                bannerBox.style.opacity = '1';
                bannerBox.style.transform = 'scale(1)';
            } else {
                // Timed Cycle mode: Natural appearance -> Hold -> Smoke vortex wipes it from behind -> Loop
                if (skySmokeVideo) skySmokeVideo.loop = false;
                runCycle();
            }
        }

        function runCycle() {
            if (settings.display_mode === 'continuous') return;
            clearTimeout(cycleTimeout);
            isCycleRunning = true;

            const frame = settings.banner_style || 'transparent';
            const holdMs = Math.max(2, (settings.hold_duration || 6)) * 1000;
            const intervalMs = Math.max(2, (settings.loop_interval || 8)) * 1000;
            const isSmokeOn = settings.smoke_enabled !== false && settings.smoke_enabled !== 0 && settings.smoke_enabled !== 'false';

            // 1. Natural Appearance (يظهر الكلمة طبيعي)
            bannerBox.style.opacity = '1';
            bannerBox.className = `fire-banner-box frame-${frame} banner-natural-in`;
            burstSparks(15);

            // After appearance completes, transition to holding
            cycleTimeout = setTimeout(() => {
                bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;

                // 2. Hold Duration (مدة بقاء الكلمة)
                cycleTimeout = setTimeout(() => {
                    // 3. Smoke Wipe Outro (يجي الدخان من ورا يشيلها إذا كان مفعل)
                    if (isSmokeOn && skySmokeVideo) {
                        skySmokeVideo.style.display = 'block';
                        skySmokeVideo.currentTime = 0;
                        skySmokeVideo.play().catch(() => {});
                    } else if (skySmokeVideo) {
                        skySmokeVideo.style.display = 'none';
                    }

                    // At peak smoke density (~700ms), the banner dissolves smoothly underneath
                    cycleTimeout = setTimeout(() => {
                        bannerBox.className = `fire-banner-box frame-${frame} banner-smoke-out`;
                        burstSparks(12);

                        // Smoke finishes clearing around 2200ms
                        cycleTimeout = setTimeout(() => {
                            if (skySmokeVideo) skySmokeVideo.style.display = 'none';
                            bannerBox.style.opacity = '0';
                            bannerBox.className = `fire-banner-box frame-${frame}`;

                            // 4. Wait Interval (الانتظار) & Reappear Naturally (ويرجع يظهر تاني بطبييعي)
                            cycleTimeout = setTimeout(() => {
                                runCycle();
                            }, intervalMs);

                        }, 1500);

                    }, 700);

                }, holdMs);

            }, 800);
        }

        // ================= Subtle Sparks Particle Engine ================= //
        const sCtx = sparkCanvas.getContext('2d');
        let sWidth = window.innerWidth, sHeight = window.innerHeight;
        let sparks = [];

        function resizeSparks() {
            sparkCanvas.width = sWidth = window.innerWidth;
            sparkCanvas.height = sHeight = window.innerHeight;
        }
        window.addEventListener('resize', resizeSparks);
        resizeSparks();

        class Spark {
            constructor(x, y, isBurst = false) {
                this.reset(x, y, isBurst);
            }
            reset(x, y, isBurst = false) {
                const rect = bannerBox.getBoundingClientRect();
                const rw = rect.width > 20 ? rect.width : 300;
                const rx = rect.left > 0 ? rect.left : (sWidth / 2 - 150);
                const ry = rect.bottom > 0 ? rect.bottom : (sHeight / 2 + 20);

                this.x = x !== undefined ? x : rx + Math.random() * rw;
                this.y = y !== undefined ? y : ry - Math.random() * 15;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 1.5;
                    this.life = 0.6 + Math.random() * 0.5;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.4;
                    this.vy = -(1.2 + Math.random() * 2.8);
                    this.life = 0.7 + Math.random() * 0.4;
                }
                this.maxLife = this.life;
                this.decay = 0.02 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 3;

                const pri = settings.color || '#ff1e00';
                const sec = settings.shine_color || '#ffd700';
                const colors = ['#ffffff', sec, sec, pri];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size = Math.max(0.5, this.size * 0.98);
                if (this.life <= 0) this.reset();
            }
            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                sCtx.save();
                sCtx.globalAlpha = alpha;
                sCtx.fillStyle = this.color;
                sCtx.shadowColor = this.color;
                sCtx.shadowBlur = 8;
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();
            }
        }

        for (let i = 0; i < 22; i++) sparks.push(new Spark());

        function burstSparks(count = 15) {
            const rect = bannerBox.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < count; i++) sparks.push(new Spark(cx, cy, true));
        }

        function renderSparks() {
            sCtx.clearRect(0, 0, sWidth, sHeight);
            if (bannerBox.style.opacity !== '0') {
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const p = sparks[i];
                    p.update();
                    p.draw();
                    if (p.life <= 0 && sparks.length > 22) sparks.splice(i, 1);
                }
            }
            requestAnimationFrame(renderSparks);
        }
        renderSparks();

        // ================= Message Listener (for live preview iframe in dashboard) ================= //
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'fire_settings_update') {
                settings = { ...settings, ...(data.settings || {}) };
                applyStyles();
                setupAnimationMode();
            } else if (data.type === 'test_action') {
                if (data.action === 'smoke_cycle') {
                    // Trigger live demonstration of smoke wipe
                    clearTimeout(cycleTimeout);
                    const frame = settings.banner_style || 'transparent';
                    bannerBox.style.opacity = '1';
                    bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;

                    setTimeout(() => {
                        if (skySmokeVideo) {
                            skySmokeVideo.style.display = 'block';
                            skySmokeVideo.currentTime = 0;
                            skySmokeVideo.play().catch(() => {});
                        }
                        setTimeout(() => {
                            bannerBox.className = `fire-banner-box frame-${frame} banner-smoke-out`;
                            burstSparks(15);
                            setTimeout(() => {
                                if (skySmokeVideo) skySmokeVideo.style.display = 'none';
                                bannerBox.style.opacity = '0';
                                setTimeout(() => {
                                    bannerBox.className = `fire-banner-box frame-${frame} banner-natural-in`;
                                    bannerBox.style.opacity = '1';
                                    burstSparks(15);
                                    setTimeout(() => {
                                        bannerBox.className = `fire-banner-box frame-${frame} banner-holding`;
                                    }, 800);
                                }, 1200);
                            }, 1500);
                        }, 700);
                    }, 400);
                }
            }
        });

        // ================= Socket.io Real-Time Updates ================= //
        try {
            const socket = io();
            socket.on('fire_settings_update', (data) => {
                if (!data || data.uid === uid) {
                    settings = { ...settings, ...(data.settings || data) };
                    applyStyles();
                    setupAnimationMode();
                }
            });
        } catch (e) {}

        // ================= Load Settings via HTTP ================= //
        async function loadSettings() {
            try {
                const res = await fetch(`/api/fire-settings/${encodeURIComponent(uid)}?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.settings) {
                        settings = { ...settings, ...data.settings };
                        applyStyles();
                        setupAnimationMode();
                    }
                }
            } catch (e) {}
        }

        loadSettings().then(() => {
            applyStyles();
            setupAnimationMode();
        });

        // Polling fallback
        setInterval(loadSettings, 4000);
    </script>
</body>
</html>
