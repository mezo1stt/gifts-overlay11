<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 شريط النص الناري | Fire Text Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@800;900&family=Almarai:wght@800;900&family=Changa:wght@800;900&family=El+Messiri:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            user-select: none;
        }

        /* Stage Container */
        .stage-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .stage-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        /* Spark Particle Canvas */
        .spark-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
        }

        /* Expanding Shockwave Ring */
        .fire-shockwave {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #ffd700;
            box-shadow: 0 0 50px var(--fire-c, #ff1e00), inset 0 0 50px var(--shine-c, #ffd700);
            opacity: 0;
            pointer-events: none;
            z-index: 9;
        }

        .fire-shockwave.active {
            animation: shockwaveExpand 0.85s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes shockwaveExpand {
            0% { transform: scale(0.2); opacity: 1; border-width: 10px; }
            100% { transform: scale(8); opacity: 0; border-width: 1px; }
        }

        /* ================= BANNER FRAMES (خالية تماماً من أي إشارات أو أسهم) ================= */
        .fire-banner-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 42px;
            border-radius: 20px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        /* 1. Transparent Frame */
        .frame-transparent {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 12px 24px;
        }

        /* 2. Glass Frame with Fiery Border */
        .frame-glass {
            background: rgba(10, 10, 18, 0.88);
            border: 2px solid rgba(255, 69, 0, 0.55);
            box-shadow: 
                0 10px 35px rgba(0, 0, 0, 0.8),
                0 0 25px rgba(255, 30, 0, 0.4),
                inset 0 0 20px rgba(255, 69, 0, 0.2);
            backdrop-filter: blur(12px);
        }

        /* 3. Molten Magma Ribbon */
        .frame-magma {
            background: linear-gradient(135deg, rgba(35, 10, 10, 0.94), rgba(15, 6, 8, 0.94));
            border: 2.5px solid var(--shine-c, #ffd700);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.9),
                0 0 35px var(--fire-c, #ff1e00),
                inset 0 0 25px rgba(255, 69, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        /* ================= ENERGY FIRE SLASH OVERLAY (مثل GIF standard_3.gif) ================= */
        .energy-slash-layer {
            position: absolute;
            inset: -40px;
            pointer-events: none;
            border-radius: inherit;
            overflow: hidden;
            z-index: 15;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .anim-energy_slash .energy-slash-layer {
            opacity: 1;
        }

        .energy-slash-layer::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: repeating-linear-gradient(
                -62deg,
                transparent 0%,
                transparent 14%,
                rgba(255, 20, 0, 0.25) 16%,
                var(--fire-c, #ff1e00) 18.5%,
                rgba(255, 140, 0, 0.95) 20.5%,
                var(--shine-c, #ffd700) 22%,
                #ffffff 22.8%,
                var(--shine-c, #ffd700) 23.6%,
                rgba(255, 60, 0, 0.7) 25.5%,
                transparent 28%,
                transparent 40%
            );
            background-size: 250% 250%;
            animation: energySlashMotion 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }

        @keyframes energySlashMotion {
            0% {
                transform: translateX(-35%) translateY(-15%);
            }
            100% {
                transform: translateX(35%) translateY(15%);
            }
        }

        /* Secondary Energy Blade Slices */
        .energy-slash-layer::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: repeating-linear-gradient(
                -62deg,
                transparent 0%,
                transparent 22%,
                rgba(255, 255, 255, 0.85) 23.5%,
                var(--shine-c, #ffd700) 24.5%,
                transparent 26%,
                transparent 50%
            );
            background-size: 250% 250%;
            animation: energySlashSecondary 1.5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
            animation-delay: -0.45s;
        }

        @keyframes energySlashSecondary {
            0% {
                transform: translateX(-40%) translateY(-20%);
            }
            100% {
                transform: translateX(40%) translateY(20%);
            }
        }

        /* ================= FIRE TEXT ELEMENTS ================= */
        .fire-text-wrapper {
            position: relative;
            display: inline-block;
            z-index: 11;
            white-space: nowrap;
        }

        .fire-text-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #2b0000;
            pointer-events: none;
            z-index: 1;
        }

        .fire-text-front {
            position: relative;
            font-weight: 900;
            line-height: 1.15;
            white-space: nowrap;
            color: #ffffff;
            z-index: 2;
            will-change: transform, filter, opacity;
            transition: transform 0.2s ease;
        }

        /* ================= ANIMATION STYLES ================= */

        /* 1. Volcanic Magma Neon (نيون بركاني متدفق) */
        .anim-volcano_magma .fire-text-front {
            background: linear-gradient(
                175deg,
                #ffffff 0%,
                #fffba8 12%,
                var(--shine-c, #ffd700) 35%,
                var(--fire-c, #ff1e00) 68%,
                #6b0000 92%,
                #300000 100%
            );
            background-size: 250% 250%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: magmaFlowAnim 3s ease-in-out infinite alternate;
        }

        @keyframes magmaFlowAnim {
            0% { background-position: 0% 15%; filter: brightness(1); }
            100% { background-position: 100% 85%; filter: brightness(1.25); }
        }

        /* 2. Laser Fire Sweep (مسح ليزر ناري) */
        .anim-laser_sweep .fire-text-wrapper::after {
            content: '';
            position: absolute;
            top: -15%;
            left: 0;
            width: 18px;
            height: 130%;
            background: linear-gradient(90deg, transparent, #ffffff, var(--shine-c, #ffd700), transparent);
            filter: drop-shadow(0 0 15px var(--fire-c, #ff1e00));
            animation: laserSweepMotion 2.2s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes laserSweepMotion {
            0% { left: -5%; opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { left: 105%; opacity: 0; }
        }

        /* 3. Blazing Flame Aura (شعلة متوهجة مستمرة) */
        .anim-blaze_flame .fire-text-front {
            animation: flameBlazeJitter 1.8s ease-in-out infinite alternate;
        }

        @keyframes flameBlazeJitter {
            0% {
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.025) translateY(-2px);
                filter: brightness(1.2) drop-shadow(0 -5px 15px var(--fire-c, #ff1e00));
            }
            100% {
                transform: scale(1.04) translateY(-1px);
                filter: brightness(1.35) drop-shadow(0 -8px 25px var(--shine-c, #ffd700));
            }
        }

        /* 4. Fire Pulse Glow (نبض ناري) */
        .anim-pulse_glow .fire-text-front {
            animation: firePulseGlowAnim 2.4s ease-in-out infinite alternate;
        }

        @keyframes firePulseGlowAnim {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.04); filter: brightness(1.25); }
        }

        /* ================= INTRO ANIMATIONS ================= */
        .intro-burst {
            animation: animBurstIntro var(--intro-dur, 1.4s) cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes animBurstIntro {
            0% {
                opacity: 0;
                transform: scale(0.1) rotate(-5deg);
                filter: brightness(4) blur(12px);
            }
            60% {
                opacity: 1;
                transform: scale(1.15) rotate(1deg);
                filter: brightness(2) blur(0px);
            }
            80% {
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: brightness(1);
            }
        }

        .intro-volcano {
            animation: animVolcanoIntro var(--intro-dur, 1.4s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes animVolcanoIntro {
            0% {
                opacity: 0;
                transform: translateY(120px) scale(0.8);
                filter: blur(15px) brightness(3);
            }
            60% {
                opacity: 1;
                transform: translateY(-12px) scale(1.06);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px) brightness(1);
            }
        }

        .intro-slide {
            animation: animSlideIntro var(--intro-dur, 1.2s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes animSlideIntro {
            0% {
                opacity: 0;
                transform: translateY(-90px) scale(0.7) skewX(-12deg);
                filter: blur(12px) brightness(2.5);
            }
            70% {
                opacity: 1;
                transform: translateY(10px) scale(1.05) skewX(2deg);
                filter: blur(0px) brightness(1.2);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) skewX(0deg);
                filter: brightness(1);
            }
        }

        .intro-burn {
            animation: animBurnIntro var(--intro-dur, 1.3s) ease forwards;
        }

        @keyframes animBurnIntro {
            0% {
                opacity: 0;
                transform: scale(1.25);
                filter: blur(25px) brightness(4);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px) brightness(1);
            }
        }

        .intro-fade {
            animation: animFadeIntro var(--intro-dur, 1.2s) ease-out forwards;
        }

        @keyframes animFadeIntro {
            0% { opacity: 0; transform: scale(0.92); filter: blur(8px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); }
        }

        /* ================= OUTRO ANIMATIONS ================= */
        .outro-burn {
            animation: animBurnOutro var(--outro-dur, 1s) cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes animBurnOutro {
            0% { opacity: 1; transform: scale(1); filter: brightness(1.3); }
            30% { transform: scale(1.12); filter: brightness(3.5); }
            100% { opacity: 0; transform: scale(0.25) rotate(6deg); filter: blur(18px) brightness(0.1); }
        }

        .outro-slide {
            animation: animSlideOutro var(--outro-dur, 0.9s) cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes animSlideOutro {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(110px) scale(0.7) skewX(8deg); filter: blur(12px) brightness(0.3); }
        }

        .outro-melt {
            animation: animMeltOutro var(--outro-dur, 1s) ease forwards;
        }

        @keyframes animMeltOutro {
            0% { opacity: 1; transform: scale(1); }
            50% { transform: scaleY(0.4) scaleX(1.3) translateY(20px); filter: brightness(2); }
            100% { opacity: 0; transform: scaleY(0.1) scaleX(1.6) translateY(50px); filter: blur(15px); }
        }

        .outro-fade {
            animation: animFadeOutro var(--outro-dur, 1s) ease-in forwards;
        }

        @keyframes animFadeOutro {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.06); filter: blur(8px) brightness(1.2); }
        }

        .holding {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <div class="stage-wrapper" id="stageWrapper">
        <div class="stage-inner" id="stageInner">

            <!-- Shockwave Ring -->
            <div class="fire-shockwave" id="shockwave"></div>

            <!-- Canvas for sparks & embers -->
            <canvas id="sparkCanvas" class="spark-canvas"></canvas>

            <!-- Fire Banner Box -->
            <div class="fire-banner-box frame-transparent" id="bannerBox">
                
                <!-- Dynamic Energy Slash Layer (like standard_3.gif) -->
                <div class="energy-slash-layer" id="energySlashLayer"></div>

                <!-- Text Wrapper -->
                <div class="fire-text-wrapper" id="textWrapper">
                    <div class="fire-text-back" id="textBack">رابط الدعم بالبايو 🔥</div>
                    <div class="fire-text-front" id="textFront">رابط الدعم بالبايو 🔥</div>
                </div>

            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || localStorage.getItem('gifts_last_uid') || 'board_XXXX';

        let settings = {
            text: 'رابط الدعم بالبايو 🔥',
            color: '#ff1e00',
            shine_color: '#ffd700',
            font_size: 64,
            font_family: 'Cairo',
            letter_spacing: 2,
            animation_style: 'energy_slash',
            display_mode: 'continuous',
            banner_style: 'transparent',
            intro_style: 'burst',
            outro_style: 'burn',
            intro_duration: 2.5,
            hold_duration: 4.0,
            outro_duration: 2.5,
            loop_interval: 8,
            neon_enabled: 1,
            neon_strength: 95,
            flame_particles: true,
            sound_enabled: true,
            position_v: 'center',
            position_h: 'center',
            offset_y: 0,
            scale: 100
        };

        const stageWrapper = document.getElementById('stageWrapper');
        const stageInner = document.getElementById('stageInner');
        const bannerBox = document.getElementById('bannerBox');
        const textWrapper = document.getElementById('textWrapper');
        const textFront = document.getElementById('textFront');
        const textBack = document.getElementById('textBack');
        const shockwave = document.getElementById('shockwave');
        const sparkCanvas = document.getElementById('sparkCanvas');

        // ================= Web Audio API Fire Whoosh ================= //
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioCtx = new AudioCtx();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        window.addEventListener('click', () => getAudioContext());

        function playFireSound() {
            if (!settings.sound_enabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const bufferSize = ctx.sampleRate * 0.55;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(350, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.18);
                filter.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.55);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                noise.start();
                noise.stop(ctx.currentTime + 0.55);
            } catch (e) {}
        }

        // ================= Apply Visual Styles ================= //
        function applyStyles() {
            const pri = settings.color || '#ff1e00';
            const sec = settings.shine_color || '#ffd700';
            const textStr = settings.text || 'رابط الدعم بالبايو 🔥';
            const fontSize = settings.font_size || 64;
            const fontFamily = settings.font_family || 'Cairo';
            const letterSpacing = settings.letter_spacing !== undefined ? settings.letter_spacing : 2;
            const animStyle = settings.animation_style || 'energy_slash';
            const bannerStyle = settings.banner_style || 'transparent';
            const neonMult = (settings.neon_strength !== undefined ? settings.neon_strength : 95) / 100;
            const scale = (settings.scale !== undefined ? settings.scale : 100) / 100;
            const offsetY = settings.offset_y !== undefined ? settings.offset_y : 0;
            const posV = settings.position_v || 'center';
            const posH = settings.position_h || 'center';

            // CSS Variables
            document.documentElement.style.setProperty('--fire-c', pri);
            document.documentElement.style.setProperty('--shine-c', sec);
            document.documentElement.style.setProperty('--intro-dur', `${settings.intro_duration || 2.5}s`);
            document.documentElement.style.setProperty('--outro-dur', `${settings.outro_duration || 2.5}s`);

            // Text Content
            textFront.textContent = textStr;
            textBack.textContent = textStr;

            // Typography
            const fontDef = `'${fontFamily}', 'Cairo', sans-serif`;
            textFront.style.fontFamily = fontDef;
            textBack.style.fontFamily = fontDef;
            textFront.style.fontSize = `${fontSize}px`;
            textBack.style.fontSize = `${fontSize}px`;
            textFront.style.letterSpacing = `${letterSpacing}px`;
            textBack.style.letterSpacing = `${letterSpacing}px`;

            // Position & Align
            if (posV === 'top') {
                stageWrapper.style.alignItems = 'flex-start';
                stageWrapper.style.paddingTop = '50px';
                stageWrapper.style.paddingBottom = '0px';
            } else if (posV === 'bottom') {
                stageWrapper.style.alignItems = 'flex-end';
                stageWrapper.style.paddingBottom = '50px';
                stageWrapper.style.paddingTop = '0px';
            } else {
                stageWrapper.style.alignItems = 'center';
                stageWrapper.style.paddingTop = '0px';
                stageWrapper.style.paddingBottom = '0px';
            }

            if (posH === 'right') {
                stageWrapper.style.justifyContent = 'flex-end';
                stageWrapper.style.paddingRight = '50px';
                stageWrapper.style.paddingLeft = '0px';
            } else if (posH === 'left') {
                stageWrapper.style.justifyContent = 'flex-start';
                stageWrapper.style.paddingLeft = '50px';
                stageWrapper.style.paddingRight = '0px';
            } else {
                stageWrapper.style.justifyContent = 'center';
                stageWrapper.style.paddingLeft = '0px';
                stageWrapper.style.paddingRight = '0px';
            }

            stageInner.style.transform = `translateY(${offsetY}px) scale(${scale})`;

            // Banner Frame
            bannerBox.className = `fire-banner-box frame-${bannerStyle} anim-${animStyle}`;

            // Volcanic 3D Underlay Extrusion Text Shadow
            const g1 = (fontSize * 0.15 * neonMult).toFixed(0);
            const g2 = (fontSize * 0.35 * neonMult).toFixed(0);
            const g3 = (fontSize * 0.70 * neonMult).toFixed(0);
            const g4 = (fontSize * 1.20 * neonMult).toFixed(0);

            textBack.style.textShadow = `
                0 1px 0 rgba(40, 0, 0, 0.95),
                0 2px 0 rgba(35, 0, 0, 0.95),
                0 3px 0 rgba(30, 0, 0, 0.95),
                0 4px 0 rgba(25, 0, 0, 0.95),
                0 5px 0 rgba(20, 0, 0, 0.95),
                0 7px 2px rgba(0, 0, 0, 0.9),
                0 10px 18px rgba(0, 0, 0, 0.95),
                0 0 ${g2}px ${pri}
            `;

            // Neon Glowing Aura on Front Text
            textFront.style.filter = `
                drop-shadow(0 0 ${g1}px #ffffff)
                drop-shadow(0 0 ${g2}px ${sec})
                drop-shadow(0 0 ${g3}px ${pri})
                drop-shadow(0 0 ${g4}px ${pri})
            `;
        }

        // ================= Animation Engine ================= //
        let cycleTimeout = null;
        function setupAnimationMode() {
            clearTimeout(cycleTimeout);

            if (settings.display_mode === 'continuous') {
                // Continuous mode: always visible and animated!
                bannerBox.classList.remove('intro-burst', 'intro-volcano', 'intro-slide', 'intro-burn', 'intro-fade');
                bannerBox.classList.remove('outro-burn', 'outro-slide', 'outro-melt', 'outro-fade');
                bannerBox.classList.add('holding');
                bannerBox.style.opacity = '1';
                bannerBox.style.transform = 'scale(1)';
            } else {
                // Timed Cycle mode: Intro -> Hold -> Outro -> Loop
                runCycle();
            }
        }

        function runCycle() {
            if (settings.display_mode === 'continuous') return;

            const introStyle = settings.intro_style || 'burst';
            const outroStyle = settings.outro_style || 'burn';
            const introMs = (settings.intro_duration || 2.5) * 1000;
            const holdMs = (settings.hold_duration || 4) * 1000;
            const outroMs = (settings.outro_duration || 2.5) * 1000;
            const intervalMs = (settings.loop_interval || 8) * 1000;

            // 1. Intro
            bannerBox.className = `fire-banner-box frame-${settings.banner_style || 'transparent'} anim-${settings.animation_style || 'energy_slash'}`;
            void bannerBox.offsetWidth;

            if (introStyle === 'burst') {
                shockwave.classList.remove('active');
                void shockwave.offsetWidth;
                shockwave.classList.add('active');
                burstSparks(35);
            } else if (introStyle === 'volcano') {
                burstSparks(25);
            }

            playFireSound();
            bannerBox.classList.add(`intro-${introStyle}`);

            // 2. Hold
            cycleTimeout = setTimeout(() => {
                bannerBox.className = `fire-banner-box frame-${settings.banner_style || 'transparent'} anim-${settings.animation_style || 'energy_slash'} holding`;

                // 3. Outro
                cycleTimeout = setTimeout(() => {
                    bannerBox.className = `fire-banner-box frame-${settings.banner_style || 'transparent'} anim-${settings.animation_style || 'energy_slash'}`;
                    void bannerBox.offsetWidth;
                    bannerBox.classList.add(`outro-${outroStyle}`);
                    burstSparks(20);

                    // 4. Sleep & Repeat
                    cycleTimeout = setTimeout(() => {
                        bannerBox.style.opacity = '0';
                        cycleTimeout = setTimeout(runCycle, intervalMs);
                    }, outroMs);

                }, holdMs);

            }, introMs);
        }

        // ================= Realistic Canvas Sparks & Embers ================= //
        const canvas = sparkCanvas;
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const MAX_PARTICLES = 35;
        const particles = [];

        class Spark {
            constructor(x, y, isBurst = false) {
                this.reset(x, y, isBurst);
            }
            reset(x, y, isBurst = false) {
                const rect = bannerBox.getBoundingClientRect();
                const rw = rect.width > 30 ? rect.width : 350;
                const rx = rect.left > 0 ? rect.left : (width / 2 - 175);
                const ry = rect.bottom > 0 ? rect.bottom : (height / 2 + 30);

                this.x = x !== undefined ? x : rx + Math.random() * rw;
                this.y = y !== undefined ? y : ry - Math.random() * 20;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 6.5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 2.5;
                    this.life = 0.7 + Math.random() * 0.5;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.8;
                    this.vy = -(1.5 + Math.random() * 3.2);
                    this.life = 0.8 + Math.random() * 0.4;
                }
                this.maxLife = this.life;
                this.decay = 0.015 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 3.5;

                const pri = settings.color || '#ff1e00';
                const sec = settings.shine_color || '#ffd700';
                const colors = ['#ffffff', sec, sec, pri, pri, '#ff4500'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size = Math.max(0.5, this.size * 0.98);
                if (this.life <= 0) this.reset();
            }
            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < MAX_PARTICLES; i++) particles.push(new Spark());

        function burstSparks(count = 25) {
            const rect = bannerBox.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            for (let i = 0; i < count; i++) particles.push(new Spark(cx, cy, true));
        }

        function renderSparks() {
            ctx.clearRect(0, 0, width, height);
            if (settings.flame_particles) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.update();
                    p.draw();
                    if (p.life <= 0 && particles.length > MAX_PARTICLES) particles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderSparks);
        }
        renderSparks();

        // ================= Message Listener (for live preview iframe in dashboard) ================= //
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'fire_settings_update') {
                settings = { ...settings, ...(data.settings || {}) };
                applyStyles();
                setupAnimationMode();
            } else if (data.type === 'test_action') {
                if (data.action === 'intro') {
                    const introStyle = settings.intro_style || 'burst';
                    bannerBox.className = `fire-banner-box frame-${settings.banner_style || 'transparent'} anim-${settings.animation_style || 'energy_slash'}`;
                    void bannerBox.offsetWidth;
                    if (introStyle === 'burst') {
                        shockwave.classList.remove('active');
                        void shockwave.offsetWidth;
                        shockwave.classList.add('active');
                        burstSparks(35);
                    }
                    playFireSound();
                    bannerBox.classList.add(`intro-${introStyle}`);
                } else if (data.action === 'outro') {
                    const outroStyle = settings.outro_style || 'burn';
                    bannerBox.className = `fire-banner-box frame-${settings.banner_style || 'transparent'} anim-${settings.animation_style || 'energy_slash'}`;
                    void bannerBox.offsetWidth;
                    bannerBox.classList.add(`outro-${outroStyle}`);
                    burstSparks(20);
                }
            }
        });

        // ================= Socket.io Real-Time Updates ================= //
        try {
            const socket = io();
            socket.on('fire_settings_update', (data) => {
                if (!data || data.uid === uid) {
                    settings = { ...settings, ...(data.settings || data) };
                    applyStyles();
                    setupAnimationMode();
                }
            });
        } catch (e) {}

        // ================= Load Settings via HTTP ================= //
        async function loadSettings() {
            try {
                const res = await fetch(`/api/fire-settings/${encodeURIComponent(uid)}?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.settings) {
                        settings = { ...settings, ...data.settings };
                        applyStyles();
                        setupAnimationMode();
                    }
                }
            } catch (e) {}
        }

        loadSettings().then(() => {
            applyStyles();
            setupAnimationMode();
        });

        // Polling fallback
        setInterval(loadSettings, 4000);
    </script>
</body>
</html>
