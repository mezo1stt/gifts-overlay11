<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Supporter Overlay | إطار آخر داعم الموحد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Changa:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Changa', sans-serif;
            user-select: none;
        }

        :root {
            --frame-color: #b594f8;
            --glow-color: rgba(181, 148, 248, 0.7);
            --hue-deg: 0deg;
            --sat-val: 100%;
            --bri-val: 100%;
            --glow-px: 16px;
        }

        /* 
           Unified Stage & Master Wrap 
           Both the Video Frame and the TikAlert Widget are strictly inside #masterWrap
           so they MOVE TOGETHER and SCALE TOGETHER as one single atomic unit!
        */
        .supporter-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .supporter-master-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1200px;
            height: 225px;
            max-width: 100vw;
            transition: transform 0.15s ease-out;
            pointer-events: auto;
        }

        /* 1. Video Frame Layer (Behind Widget) */
        .frame-video-element {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            z-index: 1;
            filter: hue-rotate(var(--hue-deg)) saturate(var(--sat-val)) brightness(var(--bri-val)) drop-shadow(0 0 var(--glow-px) var(--glow-color));
            transition: filter 0.2s ease;
        }

        /* 
           2. The TikAlert Widget Slot (Strictly Layered Directly On Top of the Frame)
           z-index: 20 ensures the widget is ALWAYS on top of the frame video.
           filter: none ensures the widget text/effects are NOT distorted by video hue rotation.
        */
        .supporter-widget-slot {
            position: absolute;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 800px;
            height: 135px;
            left: 51.5%;
            top: 50.5%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            pointer-events: auto;
            filter: none !important;
        }

        .supporter-widget-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent !important;
            overflow: hidden;
            pointer-events: auto;
            filter: none !important;
        }
    </style>
</head>
<body>

    <div class="supporter-stage" id="supporterStage">
        <!-- Master Wrap: Frame Video + TikAlert Widget locked together -->
        <div class="supporter-master-wrap" id="masterWrap">
            <!-- 1. Real Video Frame (Sakura / Fire / Golden / Banner) -->
            <video id="frameVideo" class="frame-video-element" src="/videos/sakura_frame.webm" autoplay loop muted playsinline></video>

            <!-- 2. TikAlert Live Widget (Directly ON TOP of the frame bar) -->
            <div class="supporter-widget-slot" id="widgetSlot">
                <iframe id="widgetIframe" class="supporter-widget-iframe" src="https://tikalert-eg.com/last-supporter/widget?username=mezo" allowtransparency="true" scrolling="no"></iframe>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid') || 'default';

        const masterWrapEl = document.getElementById('masterWrap');
        const videoEl = document.getElementById('frameVideo');
        const slotEl = document.getElementById('widgetSlot');
        const iframeEl = document.getElementById('widgetIframe');

        const FRAME_VIDEO_MAP = {
            'sakura': '/videos/sakura_frame.webm',
            'fire_bar': '/videos/fire_bar.webm',
            'golden_flame': '/videos/golden_flame_bar.webm',
            'stream_banner': '/videos/stream_banner_wide.webm'
        };

        function applyFrameConfig(cfg) {
            if (!cfg) return;

            const style = cfg.frameStyle || 'sakura';
            const color = cfg.frameColor || '#b594f8';
            const hue = cfg.hueRotate !== undefined ? cfg.hueRotate : 0;
            const sat = cfg.saturation !== undefined ? cfg.saturation : 100;
            const bri = cfg.brightness !== undefined ? cfg.brightness : 100;
            const glow = cfg.glowIntensity !== undefined ? cfg.glowIntensity : 1.0;
            const scale = (cfg.frameScale || 100) / 100;
            const offX = cfg.offsetX || 0;
            const offY = cfg.offsetY || 0;
            const slotW = cfg.iframeWidth || 800;
            const slotH = cfg.iframeHeight || 135;

            // 1. Apply Dynamic Colors to Video Frame
            document.documentElement.style.setProperty('--frame-color', color);
            document.documentElement.style.setProperty('--glow-color', color);
            document.documentElement.style.setProperty('--hue-deg', `${hue}deg`);
            document.documentElement.style.setProperty('--sat-val', `${sat}%`);
            document.documentElement.style.setProperty('--bri-val', `${bri}%`);
            document.documentElement.style.setProperty('--glow-px', `${16 * glow}px`);

            // 2. Move & Scale Frame and Widget TOGETHER as one single unit
            masterWrapEl.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;

            // 3. Switch Video Source based on selected real frame
            let targetVideoSrc = FRAME_VIDEO_MAP[style] || '/videos/sakura_frame.webm';
            if (style === 'custom' && cfg.customMediaUrl) {
                targetVideoSrc = cfg.customMediaUrl;
            }

            if (!videoEl.src.includes(targetVideoSrc)) {
                videoEl.src = targetVideoSrc;
                videoEl.play().catch(() => {});
            }

            // 4. Align Widget Slot onto the banner bar of the selected frame
            if (style === 'sakura') {
                masterWrapEl.style.width = '1200px';
                masterWrapEl.style.height = '225px';
                slotEl.style.left = '51.5%';
                slotEl.style.top = '50.5%';
                slotEl.style.width = '790px';
                slotEl.style.height = '135px';
            } else if (style === 'fire_bar') {
                masterWrapEl.style.width = '1200px';
                masterWrapEl.style.height = '200px';
                slotEl.style.left = '50%';
                slotEl.style.top = '50%';
                slotEl.style.width = '820px';
                slotEl.style.height = '130px';
            } else if (style === 'golden_flame') {
                masterWrapEl.style.width = '1100px';
                masterWrapEl.style.height = '180px';
                slotEl.style.left = '50%';
                slotEl.style.top = '50%';
                slotEl.style.width = '760px';
                slotEl.style.height = '120px';
            } else if (style === 'stream_banner') {
                masterWrapEl.style.width = '1200px';
                masterWrapEl.style.height = '220px';
                slotEl.style.left = '50%';
                slotEl.style.top = '50%';
                slotEl.style.width = '850px';
                slotEl.style.height = '140px';
            } else {
                slotEl.style.left = '50%';
                slotEl.style.top = '50%';
                slotEl.style.width = `${slotW}px`;
                slotEl.style.height = `${slotH}px`;
            }

            // 5. Ensure Widget URL is always loaded in the iframe
            const targetUrl = cfg.widgetUrl || 'https://tikalert-eg.com/last-supporter/widget?username=mezo';
            if (iframeEl.src !== targetUrl) {
                iframeEl.src = targetUrl;
            }
        }

        async function fetchConfig() {
            try {
                const res = await fetch(`/api/supporter-frame/${uid}`);
                const data = await res.json();
                if (data.success && data.frame) {
                    applyFrameConfig(data.frame);
                }
            } catch (e) {
                console.error('Failed to load supporter frame config:', e);
            }
        }

        fetchConfig();

        // Socket IO Real-time Updates from Control Panel
        try {
            const socket = io();
            socket.on('supporter_frame_update', (data) => {
                if (data && (data.uid === uid || uid === 'default')) {
                    applyFrameConfig(data.frame);
                }
            });
        } catch (e) {}
    </script>
</body>
</html>
