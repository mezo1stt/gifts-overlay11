<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 3D Liquid Fire · رابط الدعم والنص الناري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@800;900&family=Almarai:wght@800&family=Changa:wght@800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }

        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, align-items 0.3s ease, justify-content 0.3s ease;
        }

        .stage-inner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        /* ================= 1. WebM Video Mode (TikOverlay Original) ================= */
        .stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            will-change: opacity, filter;
        }

        .stage video.is-active {
            opacity: 1;
        }

        /* ================= 2. Custom 3D Liquid Magma Fire Text ================= */
        .custom-liquid-fire-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            user-select: none;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .liquid-text-container {
            position: relative;
            display: inline-block;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 2px;
            white-space: nowrap;
            will-change: transform, filter;
        }

        /* 3D Depth Extrusion Layer (Behind) */
        .liquid-text-back-3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #3b0101;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }

        /* Front Molten Liquid Text (Above) */
        .liquid-text-front {
            position: relative;
            z-index: 2;
            color: #fff;
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 1.5px rgba(20, 0, 0, 0.85);
            will-change: background-position, filter;
            animation: liquidFlowShine 3.2s ease-in-out infinite alternate;
        }

        @keyframes liquidFlowShine {
            0% {
                background-position: 0% 15%;
            }
            100% {
                background-position: 100% 85%;
            }
        }

        /* Continuous Pulse */
        .liquid-pulse {
            animation: liquidPulseAnim 2.2s ease-in-out infinite;
        }

        @keyframes liquidPulseAnim {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.045);
            }
        }

        /* Sparks Canvas */
        .fire-sparks-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* Custom Subtitle */
        .custom-subtitle {
            position: absolute;
            bottom: 12%;
            background: rgba(10, 10, 20, 0.85);
            color: #fff;
            padding: 8px 24px;
            border-radius: 25px;
            border: 1.5px solid rgba(255, 69, 0, 0.4);
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 69, 0, 0.8);
            display: none;
            z-index: 20;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .custom-subtitle.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <div class="stage-inner" id="stageInner">

            <!-- Mode 1: Custom 3D Liquid Fire Text -->
            <div class="custom-liquid-fire-wrapper" id="customLiquidWrapper">
                <canvas id="fireSparksCanvas" class="fire-sparks-canvas"></canvas>
                <div class="liquid-text-container liquid-pulse" id="liquidTextContainer">
                    <div class="liquid-text-back-3d" id="liquidTextBack3d">رابط الدعم بالبايو 🔥</div>
                    <div class="liquid-text-front" id="liquidTextFront">رابط الدعم بالبايو 🔥</div>
                </div>
            </div>

            <!-- Mode 2: Original WebM 3D Video (TikOverlay) -->
            <video
                id="supportLinkVideoA"
                class="is-active"
                src="/videos/dlink-liquid-red-transparent.webm"
                autoplay
                muted
                playsinline
                preload="auto"
                disablepictureinpicture
                style="display:none;"
            ></video>
            <video
                id="supportLinkVideoB"
                src="/videos/dlink-liquid-red-transparent.webm"
                muted
                playsinline
                preload="auto"
                disablepictureinpicture
                style="display:none;"
            ></video>

            <div class="custom-subtitle" id="customSubtitle"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || 'board_XXXX';

        let currentSettings = {
            mode: params.get('mode') || 'text', // 'text' (custom text) or 'video' (original WebM)
            text: params.get('text') || 'رابط الدعم بالبايو 🔥',
            accentColor: params.get('color') || '#ff1e00',
            secondaryColor: params.get('secColor') || '#ffd700',
            fontFamily: params.get('font') || 'Cairo',
            fontSize: parseInt(params.get('size') || '72'),
            scale: parseFloat(params.get('scale') || '1'),
            offsetY: parseInt(params.get('offsetY') || '0'),
            vAlign: params.get('vAlign') || 'center',
            hAlign: params.get('hAlign') || 'center',
            sparks: params.get('sparks') !== 'false',
            glowIntensity: parseInt(params.get('glow') || '100'),
            subtitle: params.get('sub') || ''
        };

        const stage = document.getElementById('stage');
        const stageInner = document.getElementById('stageInner');
        const customWrapper = document.getElementById('customLiquidWrapper');
        const textContainer = document.getElementById('liquidTextContainer');
        const textFront = document.getElementById('liquidTextFront');
        const textBack3d = document.getElementById('liquidTextBack3d');
        const videoA = document.getElementById('supportLinkVideoA');
        const videoB = document.getElementById('supportLinkVideoB');
        const subtitle = document.getElementById('customSubtitle');
        const sparksCanvas = document.getElementById('fireSparksCanvas');

        const videos = [videoA, videoB];
        let currentVidIdx = 0;
        let isTransitioning = false;
        let currentFilter = '';

        // Video CDN fallback
        const cdnUrl = 'https://alerts.tikoverlay.live/previews/widgets/support-link/dlink-liquid-red-transparent.webm';
        videos.forEach(v => {
            v.addEventListener('error', () => {
                if (v.src !== cdnUrl) {
                    v.src = cdnUrl;
                    v.load();
                }
            }, { once: true });
        });

        // ================= High-Contrast Color Filter for WebM Video ================= //
        function hexToHsl(hex) {
            let m = hex.replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
            if (!m) return { h: 0, s: 100, l: 50 };
            let r = parseInt(m[1], 16) / 255;
            let g = parseInt(m[2], 16) / 255;
            let b = parseInt(m[3], 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let l = (max + min) / 2;
            if (max === min) return { h: 0, s: 0, l: Math.round(l * 100) };
            let d = max - min;
            let s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            let h;
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h /= 6;
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function getVideoColorFilter(colorHex) {
            let { h, s, l } = hexToHsl(colorHex || '#ff1e00');
            // Supercharge brightness and saturation so it shines vividly!
            let sat = Math.max(1.3, Math.min(2.4, (s / 100) * 1.6));
            let bri = Math.max(1.2, Math.min(1.85, (l / 50) * 1.35));
            return `hue-rotate(${h}deg) saturate(${sat.toFixed(2)}) brightness(${bri.toFixed(2)}) contrast(1.4) drop-shadow(0 0 20px ${colorHex}) drop-shadow(0 0 45px ${colorHex})`;
        }

        // ================= Apply All Settings ================= //
        function applySettings(s) {
            if (!s) return;
            currentSettings = { ...currentSettings, ...s };

            const mode = currentSettings.mode || 'text';
            const priColor = currentSettings.accentColor || '#ff1e00';
            const secColor = currentSettings.secondaryColor || '#ffd700';
            const textStr = currentSettings.text !== undefined ? currentSettings.text : 'رابط الدعم بالبايو 🔥';
            const fontSize = currentSettings.fontSize || 72;
            const fontFamily = currentSettings.fontFamily || 'Cairo';
            const scale = currentSettings.scale !== undefined ? currentSettings.scale : 1.0;
            const offsetY = currentSettings.offsetY !== undefined ? currentSettings.offsetY : 0;
            const vAlign = currentSettings.vAlign || 'center';
            const hAlign = currentSettings.hAlign || 'center';
            const glowMult = (currentSettings.glowIntensity !== undefined ? currentSettings.glowIntensity : 100) / 100;

            // 1. Position & Stage Alignment
            if (vAlign === 'top') {
                stage.style.alignItems = 'flex-start';
                stage.style.paddingTop = '40px';
                stage.style.paddingBottom = '0px';
            } else if (vAlign === 'bottom') {
                stage.style.alignItems = 'flex-end';
                stage.style.paddingBottom = '40px';
                stage.style.paddingTop = '0px';
            } else {
                stage.style.alignItems = 'center';
                stage.style.paddingTop = '0px';
                stage.style.paddingBottom = '0px';
            }

            if (hAlign === 'right') {
                stage.style.justifyContent = 'flex-end';
                stage.style.paddingRight = '40px';
                stage.style.paddingLeft = '0px';
            } else if (hAlign === 'left') {
                stage.style.justifyContent = 'flex-start';
                stage.style.paddingLeft = '40px';
                stage.style.paddingRight = '0px';
            } else {
                stage.style.justifyContent = 'center';
                stage.style.paddingLeft = '0px';
                stage.style.paddingRight = '0px';
            }

            stageInner.style.transform = `translateY(${offsetY}px) scale(${scale})`;

            // 2. Mode Switching (Text vs Video)
            if (mode === 'video') {
                // Show Video, Hide Custom Text
                customWrapper.style.display = 'none';
                videoA.style.display = 'block';
                videoB.style.display = 'block';

                currentFilter = getVideoColorFilter(priColor);
                videoA.style.filter = currentFilter;
                videoB.style.filter = currentFilter;

                try {
                    videoA.play().catch(() => {});
                } catch (e) {}
            } else {
                // Show Custom 3D Liquid Magma Fire Text
                customWrapper.style.display = 'flex';
                videoA.style.display = 'none';
                videoB.style.display = 'none';
                try { videoA.pause(); videoB.pause(); } catch (e) {}

                // Text Content
                textFront.textContent = textStr;
                textBack3d.textContent = textStr;

                // Typography
                textContainer.style.fontFamily = `'${fontFamily}', 'Tajawal', sans-serif`;
                textContainer.style.fontSize = `${fontSize}px`;

                // 3D Extrusion Layer (Dark Molten Underlay)
                textBack3d.style.textShadow = `
                    0 1px 0 rgba(40, 0, 0, 0.95),
                    0 2px 0 rgba(35, 0, 0, 0.95),
                    0 3px 0 rgba(30, 0, 0, 0.95),
                    0 4px 0 rgba(25, 0, 0, 0.95),
                    0 5px 0 rgba(20, 0, 0, 0.95),
                    0 7px 2px rgba(0, 0, 0, 0.9),
                    0 10px 15px rgba(0, 0, 0, 0.95),
                    0 0 ${(30 * glowMult).toFixed(0)}px ${priColor}
                `;

                // Molten Liquid Specular Metal Gradient
                textFront.style.background = `linear-gradient(
                    175deg,
                    #ffffff 0%,
                    #fff9a6 12%,
                    ${secColor} 35%,
                    ${priColor} 68%,
                    #700000 92%,
                    #300000 100%
                )`;
                textFront.style.backgroundSize = '200% 200%';
                textFront.style.webkitBackgroundClip = 'text';
                textFront.style.backgroundClip = 'text';
                textFront.style.webkitTextFillColor = 'transparent';

                // Punchy Neon Glow Aura
                const g1 = (14 * glowMult).toFixed(0);
                const g2 = (32 * glowMult).toFixed(0);
                const g3 = (65 * glowMult).toFixed(0);
                const g4 = (110 * glowMult).toFixed(0);

                textFront.style.filter = `
                    drop-shadow(0 0 ${g1}px #ffffff)
                    drop-shadow(0 0 ${g2}px ${secColor})
                    drop-shadow(0 0 ${g3}px ${priColor})
                    drop-shadow(0 0 ${g4}px ${priColor})
                `;
            }

            // Subtitle
            if (currentSettings.subtitle && currentSettings.subtitle.trim()) {
                subtitle.textContent = currentSettings.subtitle.trim();
                subtitle.classList.add('show');
            } else {
                subtitle.classList.remove('show');
            }
        }

        // ================= Canvas Rising Fire Sparks / Embers ================= //
        const ctx = sparksCanvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = sparksCanvas.width = window.innerWidth;
            height = sparksCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const MAX_SPARKS = 35;
        const sparks = [];

        class FireSpark {
            constructor() {
                this.reset();
            }
            reset() {
                const rect = textContainer.getBoundingClientRect();
                const rw = rect.width > 20 ? rect.width : 300;
                const rx = rect.left > 0 ? rect.left : (width / 2 - 150);
                const ry = rect.bottom > 0 ? rect.bottom : (height / 2 + 30);

                this.x = rx + Math.random() * rw;
                this.y = ry - Math.random() * 25;
                this.vx = (Math.random() - 0.5) * 1.8;
                this.vy = -(1.5 + Math.random() * 3.2);
                this.size = 2 + Math.random() * 3.5;
                this.life = 0.8 + Math.random() * 0.4;
                this.maxLife = this.life;
                this.decay = 0.015 + Math.random() * 0.02;

                const pri = currentSettings.accentColor || '#ff1e00';
                const sec = currentSettings.secondaryColor || '#ffd700';
                const palette = ['#ffffff', sec, sec, pri, pri, '#ff4500'];
                this.color = palette[Math.floor(Math.random() * palette.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size = Math.max(0.5, this.size * 0.98);
                if (this.life <= 0) this.reset();
            }
            draw() {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < MAX_SPARKS; i++) sparks.push(new FireSpark());

        function loopSparks() {
            ctx.clearRect(0, 0, width, height);
            if (currentSettings.mode !== 'video' && currentSettings.sparks) {
                sparks.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
            requestAnimationFrame(loopSparks);
        }
        loopSparks();

        // ================= Seamless Dual-Video Looping Engine ================= //
        function setupVideo(v, shouldAutoPlay) {
            v.playsInline = true;
            v.muted = true;
            v.loop = false;
            v.removeAttribute('loop');

            const onReady = () => {
                try {
                    if (Number.isFinite(v.duration) && v.duration > 0.48) {
                        v.currentTime = 0.28;
                    }
                } catch (e) {}
                if (shouldAutoPlay && currentSettings.mode === 'video') {
                    let p = v.play();
                    if (p && p.catch) p.catch(() => {});
                }
            };

            if (v.readyState >= 1) onReady();
            else v.addEventListener('loadedmetadata', onReady, { once: true });

            v.addEventListener('timeupdate', (e) => {
                const active = e.currentTarget;
                if (active !== videos[currentVidIdx] || isTransitioning) return;
                const dur = active.duration;
                if (!Number.isFinite(dur) || dur <= 0) return;
                if (active.currentTime >= dur - 0.55) {
                    switchVideos();
                }
            });

            v.addEventListener('ended', () => {
                if (v === videos[currentVidIdx]) switchVideos();
            });
        }

        function switchVideos() {
            if (isTransitioning) return;
            const current = videos[currentVidIdx];
            if (!current.duration || current.duration <= 1.0) {
                current.currentTime = 0.28;
                let p = current.play();
                if (p && p.catch) p.catch(() => {});
                return;
            }

            isTransitioning = true;
            const nextIdx = 1 - currentVidIdx;
            const next = videos[nextIdx];

            next.playsInline = true;
            next.muted = true;
            if (currentFilter) next.style.filter = currentFilter;

            try {
                if (Number.isFinite(next.duration) && next.duration > 0.48) {
                    next.currentTime = 0.28;
                }
            } catch (e) {}

            let p = next.play();
            if (p && p.catch) p.catch(() => {});

            const performSwap = () => {
                next.classList.add('is-active');
                current.classList.remove('is-active');
                try { current.pause(); } catch (e) {}
                currentVidIdx = nextIdx;
                isTransitioning = false;
            };

            const onPlaying = () => {
                next.removeEventListener('playing', onPlaying);
                requestAnimationFrame(() => requestAnimationFrame(performSwap));
            };

            if (next.readyState >= 2 && Math.abs((next.currentTime || 0) - 0.28) < 0.12) {
                performSwap();
            } else {
                next.addEventListener('playing', onPlaying, { once: true });
                next.addEventListener('seeked', onPlaying, { once: true });
                setTimeout(() => { if (isTransitioning) performSwap(); }, 180);
            }
        }

        setupVideo(videoA, true);
        setupVideo(videoB, false);

        // ================= Message & Fetch Settings ================= //
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'support_link_settings_update' || data.type === 'support_link_preview_settings') {
                const s = data.settings || data.data?.settings || data;
                applySettings(s);
            }
        });

        async function fetchSettings() {
            try {
                const res = await fetch(`/api/support-link/${encodeURIComponent(uid)}?t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    applySettings(data.settings || data);
                    return;
                }
            } catch (e) {}

            try {
                const res = await fetch(`/api/widget/support-link/settings?uid=${encodeURIComponent(uid)}&t=${Date.now()}`);
                if (res.ok) {
                    const data = await res.json();
                    applySettings(data.settings || data);
                }
            } catch (e) {}
        }

        applySettings(currentSettings);
        fetchSettings();
        setInterval(fetchSettings, 3000);
    </script>
</body>
</html>
