<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌪️ أوفرلاي ركن الشاشة (Appear From Sky Corner Widget)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Changa:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        :root {
            --accent-c: #ff1744;
            --accent-glow: rgba(255, 23, 68, 0.75);
            --gold-c: #ffd700;
        }

        /* Corner Container Positioning */
        .corner-stage {
            position: fixed;
            width: 440px;
            height: 360px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        /* 4 Screen Corners */
        .pos-bottom-right {
            bottom: 24px;
            right: 24px;
            align-items: flex-end;
        }

        .pos-bottom-left {
            bottom: 24px;
            left: 24px;
            align-items: flex-start;
        }

        .pos-top-right {
            top: 24px;
            right: 24px;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .pos-top-left {
            top: 24px;
            left: 24px;
            align-items: flex-start;
            justify-content: flex-start;
        }

        /* The VFX Smoke Video */
        .sky-smoke-video {
            position: absolute;
            bottom: 0;
            width: 400px;
            height: 320px;
            object-fit: contain;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.15s ease;
            mix-blend-mode: normal;
        }

        .sky-smoke-video.active {
            opacity: 1;
        }

        /* Tint Themes for the Smoke */
        .tint-dark {
            filter: drop-shadow(0 0 16px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 35px rgba(255, 23, 68, 0.4));
        }

        .tint-crimson {
            filter: drop-shadow(0 0 25px #ff1744) drop-shadow(0 0 50px rgba(255, 70, 0, 0.6)) contrast(130%);
        }

        .tint-gold {
            filter: drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 45px rgba(255, 140, 0, 0.6)) contrast(125%);
        }

        .tint-neon {
            filter: drop-shadow(0 0 25px #00f0ff) drop-shadow(0 0 50px rgba(0, 140, 255, 0.6)) contrast(130%);
        }

        /* Ground Impact Shockwave */
        .ground-shockwave {
            position: absolute;
            bottom: 20px;
            width: 320px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--accent-c);
            box-shadow: 
                0 0 35px var(--accent-c),
                inset 0 0 25px var(--accent-c);
            opacity: 0;
            transform: scale(0.1);
            pointer-events: none;
            z-index: 5;
        }

        .ground-shockwave.blast {
            animation: shockwaveExpand 0.75s cubic-bezier(0.1, 0.85, 0.25, 1) forwards;
        }

        @keyframes shockwaveExpand {
            0% {
                opacity: 1;
                transform: scale(0.15);
                filter: brightness(3);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.15);
                filter: brightness(1.8);
            }
            100% {
                opacity: 0;
                transform: scale(1.6);
                filter: brightness(0.5);
            }
        }

        /* Corner Sparks Canvas */
        .sparks-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
        }

        /* The Corner Supporter Badge */
        .corner-badge-card {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(22, 6, 12, 0.94) 0%, rgba(10, 2, 6, 0.96) 100%);
            border: 2px solid var(--accent-c);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.95),
                0 0 30px var(--accent-glow),
                inset 0 0 20px rgba(255, 23, 68, 0.25);
            border-radius: 18px;
            padding: 12px 22px;
            min-width: 280px;
            max-width: 380px;
            opacity: 0;
            transform: translateY(35px) scale(0.85);
            transition: all 0.45s cubic-bezier(0.18, 1, 0.32, 1);
            margin-bottom: 16px;
        }

        .corner-badge-card.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .corner-badge-card.dismissing {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            filter: blur(8px);
        }

        /* Avatar or Icon Circle */
        .badge-avatar-wrap {
            position: relative;
            width: 54px;
            height: 54px;
            flex-shrink: 0;
        }

        .badge-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff1744, #8b001d);
            border: 2px solid #ffffff;
            box-shadow: 0 0 16px var(--accent-c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            object-fit: cover;
        }

        .badge-crown {
            position: absolute;
            top: -10px;
            right: -6px;
            font-size: 18px;
            filter: drop-shadow(0 0 6px #ffd700);
            animation: crownBounce 2s ease-in-out infinite alternate;
        }

        @keyframes crownBounce {
            0% { transform: translateY(0) rotate(-8deg); }
            100% { transform: translateY(-4px) rotate(4deg); }
        }

        /* Badge Text Details */
        .badge-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .badge-category {
            font-size: 12px;
            font-weight: 800;
            color: #ff8da1;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-category-dot {
            width: 7px;
            height: 7px;
            background: #ff1744;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff1744;
            animation: pulseDot 1.4s infinite alternate;
        }

        @keyframes pulseDot {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .badge-name {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 
                0 0 10px #ffffff,
                0 0 20px var(--accent-c);
            line-height: 1.2;
        }

        .badge-subtitle {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold-c);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="corner-stage pos-bottom-right" id="cornerStage">
        
        <!-- Sparks Canvas -->
        <canvas id="sparksCanvas" class="sparks-canvas"></canvas>

        <!-- Smoke VFX Video from FootageCrate -->
        <video id="skyVideo" class="sky-smoke-video tint-dark" src="/videos/appear_from_sky.webm" playsinline muted preload="auto"></video>

        <!-- Ground Impact Shockwave -->
        <div id="groundShockwave" class="ground-shockwave"></div>

        <!-- The Corner Badge Card -->
        <div class="corner-badge-card" id="cornerBadge">
            <div class="badge-avatar-wrap">
                <div class="badge-avatar" id="badgeAvatar">👑</div>
                <div class="badge-crown">✨</div>
            </div>
            <div class="badge-details">
                <div class="badge-category">
                    <span class="badge-category-dot"></span>
                    <span id="badgeCategory">آخر داعم للبث 🔥</span>
                </div>
                <div class="badge-name" id="badgeName">MEZO TIK</div>
                <div class="badge-subtitle" id="badgeSubtitle">أرسل 1,000 عملة 💎</div>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid') || localStorage.getItem('gifts_last_uid') || 'board_XXXX';

        let config = {
            position: params.get('pos') || 'bottom-right', // 'bottom-right', 'bottom-left', 'top-right', 'top-left'
            tint: params.get('tint') || 'dark',           // 'dark', 'crimson', 'gold', 'neon'
            category: params.get('cat') || 'آخر داعم للبث 🔥',
            name: params.get('name') || 'MEZO TIK',
            subtitle: params.get('sub') || 'أرسل 1,000 عملة 💎',
            avatar: params.get('avatar') || '👑',
            color: params.get('color') || '#ff1744',
            hold_time: parseFloat(params.get('hold') || 5.0),
            loop_interval: parseFloat(params.get('loop') || 10.0),
            auto_loop: params.get('auto') !== '0'
        };

        const stage = document.getElementById('cornerStage');
        const video = document.getElementById('skyVideo');
        const shockwave = document.getElementById('groundShockwave');
        const badge = document.getElementById('cornerBadge');
        const sparksCanvas = document.getElementById('sparksCanvas');
        const badgeName = document.getElementById('badgeName');
        const badgeSubtitle = document.getElementById('badgeSubtitle');
        const badgeCategory = document.getElementById('badgeCategory');
        const badgeAvatar = document.getElementById('badgeAvatar');

        function applyConfig() {
            // Position
            stage.className = `corner-stage pos-${config.position}`;

            // Tint
            video.className = `sky-smoke-video tint-${config.tint}`;

            // Colors
            document.documentElement.style.setProperty('--accent-c', config.color);
            document.documentElement.style.setProperty('--accent-glow', config.color + 'aa');

            // Text
            badgeCategory.textContent = config.category;
            badgeName.textContent = config.name;
            badgeSubtitle.textContent = config.subtitle;
            badgeAvatar.textContent = config.avatar;
        }
        applyConfig();

        // ================= Sparks Canvas ================= //
        const ctx = sparksCanvas.getContext('2d');
        let sparks = [];

        function resizeSparks() {
            sparksCanvas.width = stage.offsetWidth || 440;
            sparksCanvas.height = stage.offsetHeight || 360;
        }
        window.addEventListener('resize', resizeSparks);
        resizeSparks();

        class CornerSpark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 2.5;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
                this.size = 2 + Math.random() * 3.5;
                this.color = Math.random() > 0.5 ? '#ffffff' : (config.color || '#ff1744');
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.12; // Gravity
                this.life -= this.decay;
                this.size = Math.max(0.5, this.size * 0.96);
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function burstSparks(count = 35) {
            const cx = sparksCanvas.width / 2;
            const cy = sparksCanvas.height - 50;
            for (let i = 0; i < count; i++) {
                sparks.push(new CornerSpark(cx, cy));
            }
        }

        function renderSparks() {
            ctx.clearRect(0, 0, sparksCanvas.width, sparksCanvas.height);
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.update();
                s.draw(ctx);
                if (s.life <= 0) sparks.splice(i, 1);
            }
            requestAnimationFrame(renderSparks);
        }
        renderSparks();

        // ================= Play Audio Impact ================= //
        function playImpactSound() {
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, actx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + 0.5);
            } catch (e) {}
        }

        // ================= Trigger Sequence ================= //
        let isRunning = false;
        let loopTimer = null;

        function triggerAppearSequence() {
            if (isRunning) return;
            isRunning = true;

            // Reset elements
            badge.className = 'corner-badge-card';
            shockwave.classList.remove('blast');
            void shockwave.offsetWidth;

            // 1. Start Smoke Video from sky
            video.classList.add('active');
            video.currentTime = 0;
            video.play().catch(() => {});

            // 2. Landing Impact when smoke hits the ground (~0.85s)
            setTimeout(() => {
                shockwave.classList.add('blast');
                burstSparks(40);
                playImpactSound();

                // 3. Reveal the Badge from the smoke
                badge.classList.add('revealed');
            }, 820);

            // 4. Video finishes at 2.0s
            setTimeout(() => {
                video.classList.remove('active');
            }, 2100);

            // 5. Dismiss Badge after hold time
            const totalHoldMs = (config.hold_time || 5) * 1000;
            setTimeout(() => {
                badge.classList.remove('revealed');
                badge.classList.add('dismissing');

                setTimeout(() => {
                    badge.className = 'corner-badge-card';
                    isRunning = false;

                    // 6. Schedule next loop if auto_loop enabled
                    if (config.auto_loop) {
                        clearTimeout(loopTimer);
                        loopTimer = setTimeout(triggerAppearSequence, (config.loop_interval || 10) * 1000);
                    }
                }, 500);

            }, 850 + totalHoldMs);
        }

        // Start initial sequence
        setTimeout(triggerAppearSequence, 1200);

        // ================= Socket.io Listener for Real-time Events ================= //
        try {
            const socket = io();
            socket.on('corner_trigger', (data) => {
                if (!data || data.uid === uid || !data.uid) {
                    if (data.name) config.name = data.name;
                    if (data.subtitle) config.subtitle = data.subtitle;
                    if (data.category) config.category = data.category;
                    if (data.position) config.position = data.position;
                    if (data.tint) config.tint = data.tint;
                    if (data.color) config.color = data.color;
                    applyConfig();
                    triggerAppearSequence();
                }
            });

            // Also listen to tiktok gifts to trigger on gift!
            socket.on('gift_received', (data) => {
                config.name = data.username || data.nickname || 'داعم رائع';
                config.subtitle = `أرسل ${data.gift_name || 'هدية'} x${data.gift_count || 1} 🔥`;
                config.category = 'آخر داعم للبث 🎁';
                applyConfig();
                triggerAppearSequence();
            });
        } catch (e) {}

        // Listen for postMessage from dashboard tester
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data) return;
            if (data.type === 'corner_update') {
                config = { ...config, ...(data.config || {}) };
                applyConfig();
            } else if (data.type === 'corner_trigger') {
                if (data.config) {
                    config = { ...config, ...data.config };
                    applyConfig();
                }
                triggerAppearSequence();
            }
        });
    </script>
</body>
</html>
