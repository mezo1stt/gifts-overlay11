<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard Display | لوحة النتائج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Changa:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Changa', sans-serif;
            user-select: none;
        }

        :root {
            --badge-w: 92px;
            --badge-font-sz: 54px;
        }

        /* Perfectly Symmetrical 3-Column Esports Layout */
        .scoreboard-stage {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: clamp(12px, 2vw, 24px);
            width: min(94vw, 860px);
            max-width: 860px;
            background: linear-gradient(135deg, rgba(20, 10, 15, 0.95), rgba(10, 14, 25, 0.95));
            border: 2px solid rgba(255, 255, 255, 0.16);
            border-radius: 26px;
            padding: clamp(10px, 1.5vw, 16px) clamp(16px, 2.5vw, 32px);
            box-shadow: 
                0 12px 45px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(255, 42, 74, 0.28),
                0 0 30px rgba(34, 255, 136, 0.28);
            backdrop-filter: blur(16px);
            direction: ltr; /* Grid symmetry strictly LTR */
            box-sizing: border-box;
        }

        /* Team Columns: Equal 1fr width prevents any off-center skew */
        .team-box {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            overflow: hidden;
        }

        /* Team A: Red side (Left in LTR) */
        .team-box.team-a {
            justify-content: flex-end;
            direction: rtl; /* Arabic text inside */
        }

        /* Team B: Green side (Right in LTR) */
        .team-box.team-b {
            justify-content: flex-start;
            direction: rtl; /* Arabic text inside */
        }

        .team-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            flex: 1;
        }

        .team-a .team-info {
            text-align: right;
            align-items: flex-start;
        }

        .team-b .team-info {
            text-align: right;
            align-items: flex-end;
        }

        .team-name {
            font-size: clamp(16px, 2vw, 24px);
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .team-badge {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            opacity: 0.85;
            white-space: nowrap;
        }

        /* Mathematically symmetric score badges that dynamically scale */
        .team-score-badge {
            width: var(--badge-w, 92px);
            min-width: var(--badge-w, 92px);
            height: 80px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            font-family: 'Changa', sans-serif;
            font-size: var(--badge-font-sz, 54px);
            font-weight: 900;
            line-height: 1;
            padding: 0 10px;
            font-variant-numeric: tabular-nums;
            transition: all 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            box-sizing: border-box;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Team A: Red Neon */
        .team-a .team-name {
            color: #ff3355;
            text-shadow: 0 0 10px rgba(255, 51, 85, 0.65);
        }
        .team-a .team-badge {
            color: #ff8899;
        }
        .team-a .team-score-badge {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(255, 34, 68, 0.35), rgba(120, 10, 25, 0.45));
            border: 2px solid #ff2a4a;
            box-shadow: 
                0 0 20px rgba(255, 42, 74, 0.65),
                inset 0 0 14px rgba(255, 42, 74, 0.3);
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
        }

        /* Team B: Green Neon */
        .team-b .team-name {
            color: #22ff88;
            text-shadow: 0 0 10px rgba(34, 255, 136, 0.65);
        }
        .team-b .team-badge {
            color: #88ffbb;
        }
        .team-b .team-score-badge {
            color: #ffffff;
            background: linear-gradient(135deg, rgba(34, 255, 136, 0.3), rgba(10, 90, 45, 0.45));
            border: 2px solid #22ff88;
            box-shadow: 
                0 0 20px rgba(34, 255, 136, 0.65),
                inset 0 0 14px rgba(34, 255, 136, 0.3);
            text-shadow: 0 0 16px rgba(255, 255, 255, 0.85);
        }

        /* Perfectly Centered VS Divider */
        .center-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 18px;
            border-left: 1.5px solid rgba(255, 255, 255, 0.12);
            border-right: 1.5px solid rgba(255, 255, 255, 0.12);
            direction: rtl;
        }

        .vs-badge {
            font-family: 'Changa', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 18px rgba(255, 215, 0, 0.85);
            letter-spacing: 2px;
            line-height: 1;
        }

        .scoreboard-title-text {
            font-size: 12.5px;
            font-weight: 800;
            color: #cbd5e1;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .score-bump {
            transform: scale(1.3) !important;
            filter: brightness(1.3);
        }
    </style>
</head>
<body>

    <div class="scoreboard-stage" id="scoreStage">
        
        <!-- TEAM A (Red) -->
        <div class="team-box team-a">
            <div class="team-info">
                <span class="team-name" id="nameA">المخربين</span>
                <span class="team-badge">الفريق الأحمر</span>
            </div>
            <div class="team-score-badge" id="scoreA">0</div>
        </div>

        <!-- CENTER VS (Always Dead-Center) -->
        <div class="center-divider">
            <span class="vs-badge">VS</span>
            <span class="scoreboard-title-text" id="boardTitle">🏆 تحدي الأساطير 🏆</span>
        </div>

        <!-- TEAM B (Green) -->
        <div class="team-box team-b">
            <div class="team-score-badge" id="scoreB">0</div>
            <div class="team-info">
                <span class="team-name" id="nameB">المساعدين</span>
                <span class="team-badge">الفريق الأخضر</span>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const boardId = params.get('id') || params.get('uid') || 'default';

        const nameAEl = document.getElementById('nameA');
        const nameBEl = document.getElementById('nameB');
        const scoreAEl = document.getElementById('scoreA');
        const scoreBEl = document.getElementById('scoreB');
        const boardTitleEl = document.getElementById('boardTitle');

        let prevScoreA = null;
        let prevScoreB = null;

        function updateUI(board) {
            if (!board) return;
            nameAEl.textContent = board.team_a_name || 'المخربين';
            nameBEl.textContent = board.team_b_name || 'المساعدين';
            boardTitleEl.textContent = board.title || '🏆 تحدي الأساطير 🏆';

            const rawA = board.team_a_score !== undefined ? board.team_a_score : 0;
            const rawB = board.team_b_score !== undefined ? board.team_b_score : 0;
            const newA = parseInt(rawA) || 0;
            const newB = parseInt(rawB) || 0;

            if (prevScoreA !== null && newA !== prevScoreA) {
                scoreAEl.classList.add('score-bump');
                setTimeout(() => scoreAEl.classList.remove('score-bump'), 300);
            }
            if (prevScoreB !== null && newB !== prevScoreB) {
                scoreBEl.classList.add('score-bump');
                setTimeout(() => scoreBEl.classList.remove('score-bump'), 300);
            }

            // Symmetrical Dynamic Font Sizing & Badge Width for 100,000+ WIN
            const strA = newA >= 1000 ? newA.toLocaleString() : String(newA);
            const strB = newB >= 1000 ? newB.toLocaleString() : String(newB);
            const maxLen = Math.max(strA.length, strB.length);

            let badgeW = 92;
            let fontSz = 54;

            if (maxLen <= 2) {
                badgeW = 92;
                fontSz = 54;
            } else if (maxLen === 3) {
                badgeW = 104;
                fontSz = 44;
            } else if (maxLen === 4) {
                badgeW = 118;
                fontSz = 36;
            } else if (maxLen === 5) {
                badgeW = 132;
                fontSz = 30;
            } else if (maxLen === 6) {
                badgeW = 146;
                fontSz = 25;
            } else if (maxLen === 7) {
                badgeW = 152;
                fontSz = 23;
            } else {
                badgeW = 164;
                fontSz = 20;
            }

            document.documentElement.style.setProperty('--badge-w', `${badgeW}px`);
            document.documentElement.style.setProperty('--badge-font-sz', `${fontSz}px`);

            scoreAEl.textContent = strA;
            scoreBEl.textContent = strB;

            prevScoreA = newA;
            prevScoreB = newB;
        }

        async function fetchBoard() {
            try {
                const res = await fetch(`/api/scoreboard/${boardId}`);
                const data = await res.json();
                if (data.success && data.board) {
                    updateUI(data.board);
                }
            } catch (e) {
                console.error(e);
            }
        }

        fetchBoard();
        setInterval(fetchBoard, 600);

        // Socket IO real-time
        try {
            const socket = io();
            socket.on('scoreboard_update', (data) => {
                if (data && (data.board_id === boardId || boardId === 'default')) {
                    updateUI(data);
                }
            });
        } catch (e) {}
    </script>
</body>
</html>
